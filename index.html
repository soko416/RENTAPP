<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1F27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi material</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9EE; --panel:#FFFFFF; --ink:#1B1F27; --muted:#657084; --line:#D3D8E0;
  --accent:#2457F5; --accent-ink:#FFFFFF;
  --ok:#1B7F46; --okbg:#DDF1E5; --warn:#9A6200; --warnbg:#FBEBCB; --bad:#B8321F; --badbg:#F8DCD7;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181F; --panel:#1E242E; --ink:#E8ECF2; --muted:#9AA5B8; --line:#2E3644;
    --accent:#6C8DFF; --accent-ink:#0E1320;
    --ok:#5ED08C; --okbg:#173525; --warn:#F0B84A; --warnbg:#3A2E10; --bad:#FF8A78; --badbg:#3E1D18;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:700;font-stretch:88%;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:15px;font-weight:700;margin:0}
header.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.pad{padding:0 16px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:var(--r);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.block{width:100%;margin-top:14px}
.btn[disabled]{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{margin:12px 16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--bg)}
.row.head{background:var(--bg)}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;color:var(--muted)}
.sub.bad{color:var(--bad)}
.group{margin:22px 16px 0;font-weight:700;font-size:14px;color:var(--muted)}
.count{font-weight:700;font-size:18px;font-stretch:88%;min-width:28px;text-align:right}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.empty{margin:40px 24px;text-align:center;color:var(--muted)}
.search{margin:12px 16px 0}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;accent-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.chkrow{display:flex;align-items:center;gap:12px;margin:0;padding:9px 0;font-size:16px;color:var(--ink);cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{margin:12px 16px 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 16px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:14px 0 13px;border-top:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
.modal-back{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal-back.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;font-stretch:88%;margin-bottom:4px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:var(--r);font-weight:600;display:none}
.toast.bad{background:var(--bad);color:#fff}
.toast.show{display:block}
.login{padding:calc(64px + env(safe-area-inset-top)) 24px 24px;max-width:420px;margin:0 auto}
.login h1{font-size:30px;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;padding:12px;border:0;background:var(--panel);color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.cam{position:relative;margin-top:12px;background:#0b0e14;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#9AA5B8}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18% 18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
.msg{margin-top:12px;padding:12px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-weight:600;min-height:48px}
.msg.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.msg.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.msg.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.qrbox{width:150px;height:150px;margin:10px auto;background:#fff;padding:8px;border-radius:8px}
.qrbox svg{width:100%;height:100%;display:block}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.sum{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum .row{padding:9px 12px;font-size:15px}
.sum .tot{font-weight:700;font-size:18px;font-stretch:88%;background:var(--bg)}
.linkbox{display:flex;gap:8px;margin-top:8px}
.linkbox input{font-size:13px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg);flex:none}
.hero{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:var(--r);margin-bottom:10px}
.cal{margin:12px 16px 0}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head h2{flex:1;text-align:center;font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600;padding:2px 0}
.cal-day{min-height:56px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px 2px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden}
.cal-day.off{opacity:.4}
.cal-day.today{border:2px solid var(--accent)}
.cal-day.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal-day .n{font-size:14px;font-weight:600}
.cal-day .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.cal-day .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cal-day .dot.draft{background:transparent;border:1.5px solid var(--muted)}
.cal-day .dot.done{background:var(--ok);border-radius:2px}
.cal-day .pc{font-size:11px;color:var(--ink);opacity:.7}
.logo-prev{max-width:180px;max-height:80px;display:block;margin:8px 0;background:#fff;padding:4px;border-radius:6px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.55);vertical-align:-2px;margin-right:6px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:14px}
.chip .sw{margin:0}
button.chip{font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.lg-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.lg-row input[type=color]{width:46px;height:42px;padding:2px;flex:none}
.swbtn{width:46px;height:42px;border-radius:8px;border:2px solid var(--line);flex:none;cursor:pointer;padding:0}
.swbtn.open{border-color:var(--accent)}
.pal{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 2px;padding:10px;background:var(--bg);border-radius:var(--r)}
.pal label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--ink)}
.pal input[type=color]{width:40px;height:34px}
.offbar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));left:12px;z-index:9;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);padding:4px 14px;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  body{background:#fff!important}
  #print.labels{display:grid!important;grid-template-columns:repeat(3,1fr);gap:4mm;padding:6mm}
  .label{display:flex;align-items:center;gap:3mm;border:0.3mm solid #000;padding:2.5mm;break-inside:avoid;color:#000;background:#fff}
  .label .qr{width:22mm;height:22mm;flex:none}
  .label .qr svg{width:100%;height:100%}
  .label .lt{display:flex;flex-direction:column;font-size:8pt;line-height:1.25;min-width:0}
  .label .lt b{font-size:9pt}
  #print.doc{display:block!important;padding:12mm;color:#000;background:#fff;font-size:11pt;line-height:1.35;font-family:Arial,Helvetica,sans-serif}
  .doc h1{font-size:20pt;margin:0 0 2mm;white-space:normal;font-stretch:100%}
  .doc h2{font-size:13pt;margin:6mm 0 2mm;border-bottom:.3mm solid #000;padding-bottom:1mm}
  .doc p{margin:0 0 1mm}
  .doc table{width:100%;border-collapse:collapse}
  .doc th,.doc td{padding:1.6mm 2mm;border-bottom:.2mm solid #999;text-align:left;vertical-align:top}
  .doc .r{text-align:right}
  .doc tr{break-inside:avoid}
  .doc .box{display:inline-block;width:4.2mm;height:4.2mm;border:.35mm solid #000;vertical-align:-.7mm}
  .doc .tot td{font-weight:700;border-bottom:0}
  .doc .small{font-size:9pt;color:#444}
  .doc .nw{white-space:nowrap}
  .doc .sw{border:.3mm solid #000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;margin-bottom:6mm}
  .doc .head img{max-height:20mm;max-width:55mm;display:block}
}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal-back" onpointerdown="window.__bgDown = (event.target === this)" onclick="if (event.target === this && window.__bgDown) closeModal(); window.__bgDown = false"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast" role="status"></div>
<div id="print"></div>
<div id="offbar" class="offbar" role="status" hidden onclick="openPending()"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ============ Conexión con tu base de datos ============ */
const APP_VERSION = '14 · 1 nov 2026';
const SUPABASE_URL = 'https://akzopqnsrpcwuxaaqkfc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrem9wcW5zcnBjd3V4YWFxa2ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzExNjMsImV4cCI6MjEwOTEwNzE2M30.597llIN7plBgQBbueLQOJMKLVDXnzM9ytOg0UEO6DAc';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT = iso => new Date(iso).toLocaleString('es-ES', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const fmtD = iso => new Date(iso).toLocaleDateString('es-ES', {day:'numeric', month:'short'});
const fmtFull = iso => new Date(iso).toLocaleString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
const eur = n => new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR'}).format(n || 0);
const toLocalInput = iso => { const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fromLocalInput = v => new Date(v).toISOString();
const opts = (list, sel) => list.map(([v,t]) => `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`).join('');

const UNIT_STATUS = {ok:'Operativa', repair:'En reparación', lost:'Perdida', retired:'De baja'};
const UNIT_CLASS = {ok:'ok', repair:'warn', lost:'bad', retired:'bad'};
const PROJ_STATUS = {draft:'Borrador', confirmed:'Confirmado', done:'Hecho', cancelled:'Cancelado'};
const RES_STATE = {planned:'Pendiente', out:'Fuera', returned:'Devuelto', mixed:'Parcial'};
const RES_CLASS = {planned:'', out:'warn', returned:'ok', mixed:'warn'};

let toastTimer;
function toast(msg, bad=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (bad?' bad':'');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.className='toast', bad?6000:2500);
}
function errMsg(e){
  if (!e) return 'Error desconocido';
  if (e.code === '23P01') return 'Esa unidad ya está reservada en otro show que se solapa en fechas.';
  if (e.code === '23505') return 'Ya existe un elemento con ese valor (nombre o código repetido).';
  if (e.code === '23514') return e.message;
  if (e.code === 'PGRST205' || e.code === 'PGRST204' || /schema cache/i.test(e.message||'')) return 'Falta ejecutar un script nuevo en Supabase: esquema_v2 a v6 (SQL Editor).';
  if (/fetch|network/i.test(e.message||'')) return 'Sin conexión. Comprueba tu internet.';
  return e.message || 'Error';
}
async function db(promise){
  const r = await promise;
  if (r.error){ toast(errMsg(r.error), true); throw r.error; }
  return r.data;
}
function openModal(html){ $('#sheet').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal(){
  $('#modal').classList.remove('open'); $('#sheet').innerHTML='';
  if (condResolve){ const r = condResolve; condResolve = null; r(null); }
}
function qrSvg(text){
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:4, margin:0, scalable:true});
}
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ============ Estado ============ */
const S = {
  session:null, tab:'material', view:null, matMode:'equipos', nagged:false,
  categories:[], models:[], units:[], projects:[], reservations:[], techs:[], assigns:[],
  kits:[], kitItems:[], bulkRes:[], maint:[], settings:{}, clients:[],
  showsMode:'lista', calMonth:null, calDay:null,
  count:{seen:new Set()}, queue:[], failed:[],
  scan:{project:'', mode:'out', log:[]}
};
const modelById = id => S.models.find(m => m.id === id);
const unitById = id => S.units.find(u => u.id === id);
const projById = id => S.projects.find(p => p.id === id);
const techById = id => S.techs.find(t => t.id === id);
const kitById = id => S.kits.find(k => k.id === id);
const clientById = id => S.clients.find(c => c.id === id);
const unitLabel = u => { const m = modelById(u.model_id); return (m ? m.name : '') + (u.serial_number ? ' · ' + u.serial_number : ''); };

// Supabase devuelve como mucho 1000 filas por consulta: se pide por páginas para no perder datos
async function fetchAll(table){
  const out = [];
  for (let from = 0; ; from += 1000){
    const r = await sb.from(table).select('*').order('id').range(from, from + 999);
    if (r.error) return {error:r.error};
    out.push(...r.data);
    if (r.data.length < 1000) break;
  }
  return {data:out};
}
const byName = (a,b) => String(a.name||'').localeCompare(String(b.name||''), 'es', {numeric:true});
const SNAP_KEY = 'mm_snapshot_v1', QUEUE_KEY = 'mm_queue_v1', FAIL_KEY = 'mm_failed_v1', WAS_KEY = 'mm_was_in';
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout|offline/i.test((e && e.message) || '');
const SNAP_FIELDS = ['categories','models','units','projects','reservations','techs','assigns','kits','kitItems','bulkRes','maint','settings','clients'];
function saveSnapshot(){ const o = {at:Date.now()}; SNAP_FIELDS.forEach(f => o[f] = S[f]); lsSet(SNAP_KEY, o); }
function loadSnapshot(){
  const s = lsGet(SNAP_KEY, null); if (!s) return false;
  SNAP_FIELDS.forEach(f => { if (s[f] !== undefined) S[f] = s[f]; });
  return true;
}
async function loadAll(draw=true){
  const tables = ['categories','equipment_models','units','projects','reservations','technicians','crew_assignments','kits','kit_items','bulk_reservations','maintenance_logs','clients'];
  let rs, st;
  try { [rs, st] = await Promise.all([Promise.all(tables.map(t => fetchAll(t))), sb.from('settings').select('*').eq('id', 1).maybeSingle()]); }
  catch(e){ rs = [{error:e}]; st = {}; }
  const bad = rs.find(r => r.error) || (st.error ? st : null);
  if (bad){
    if (isNetErr(bad.error) && loadSnapshot()){
      S.queue.forEach(applyLocal);
      if (draw) render();
      updateOffBar(); toast('Sin conexión: trabajas con los datos guardados en este dispositivo.');
      return;
    }
    if (bad.error && (bad.error.code === 'PGRST301' || /jwt/i.test(bad.error.message || ''))){
      S.session = null; lsSet(WAS_KEY, false); render(); return toast('La sesión ha caducado. Vuelve a entrar.', true);
    }
    if (isSchemaErr(bad.error)){ render(); showSchemaHelp(await schemaMissing()); return; }
    toast(errMsg(bad.error), true); return;
  }
  [S.categories, S.models, S.units, S.projects, S.reservations, S.techs, S.assigns, S.kits, S.kitItems, S.bulkRes, S.maint, S.clients] = rs.map(r => r.data);
  S.clients.sort(byName); S.categories.sort(byName); S.models.sort(byName); S.techs.sort(byName); S.kits.sort(byName);
  S.units.sort((a,b) => String(a.created_at).localeCompare(String(b.created_at)));
  S.projects.sort((a,b) => new Date(a.starts_at) - new Date(b.starts_at));
  S.settings = st.data || {};
  S.queue.forEach(applyLocal);          // lo que aún no se ha enviado sigue viéndose reflejado
  saveSnapshot(); updateOffBar();
  if (!S.schemaChecked && navigator.onLine){ S.schemaChecked = true; schemaMissing().then(m => { if (m.length) showSchemaHelp(m); }); }
  if (draw) render();
  if (!S.nagged){ S.nagged = true; setTimeout(flushQueue, 300); }
}

// Unidades ocupadas por OTROS shows que se solapan con las fechas de p
function busyUnits(p){
  const busy = new Set(), s = new Date(p.starts_at), e = new Date(p.ends_at);
  S.reservations.forEach(r => {
    if (r.state === 'returned' || r.project_id === p.id) return;
    const q = projById(r.project_id);
    if (q && new Date(q.starts_at) < e && new Date(q.ends_at) > s) busy.add(r.unit_id);
  });
  return busy;
}
function freeUnits(p, modelId){
  const busy = busyUnits(p);
  const mine = new Set(S.reservations.filter(r => r.project_id === p.id && r.state !== 'returned').map(r => r.unit_id));
  return S.units.filter(u => u.model_id === modelId && u.status === 'ok' && !busy.has(u.id) && !mine.has(u.id));
}
// Material por cantidad: stock menos lo reservado en shows que se solapan (incluido este)
function bulkUsed(p, modelId, excludeId){
  let used = 0; const s = new Date(p.starts_at), e = new Date(p.ends_at);
  S.bulkRes.forEach(b => {
    if (b.model_id !== modelId || b.state === 'returned' || b.id === excludeId) return;
    const q = projById(b.project_id);
    if (q && q.status !== 'cancelled' && new Date(q.starts_at) < e && new Date(q.ends_at) > s) used += b.qty;
  });
  return used;
}
const bulkFree = (p, modelId) => { const m = modelById(modelId); return Math.max(0, (m ? m.bulk_stock : 0) - bulkUsed(p, modelId)); };

const pieces = p => S.reservations.filter(r => r.project_id === p.id).length + S.bulkRes.filter(b => b.project_id === p.id).reduce((s,b) => s + b.qty, 0);

function aggState(arr){
  if (!arr.length) return 'planned';
  if (arr.every(x => x.state === 'returned')) return 'returned';
  if (arr.every(x => x.state === 'planned')) return 'planned';
  if (arr.every(x => x.state === 'out')) return 'out';
  return 'mixed';
}

// Presupuesto
function projectQty(p){
  const m = new Map();
  S.reservations.filter(r => r.project_id === p.id).forEach(r => { const u = unitById(r.unit_id); if (u) m.set(u.model_id, (m.get(u.model_id)||0) + 1); });
  S.bulkRes.filter(b => b.project_id === p.id).forEach(b => m.set(b.model_id, (m.get(b.model_id)||0) + b.qty));
  return m;
}
function rentalDays(p, override){
  const d = override != null ? override : p.rental_days;
  return d > 0 ? d : Math.max(1, Math.ceil((new Date(p.ends_at) - new Date(p.starts_at)) / 86400000));
}
function quoteCalc(p, opt={}){
  const days = rentalDays(p, opt.days);
  const disc = opt.disc != null ? opt.disc : Number(p.discount_pct || 0);
  const vat = opt.vat != null ? opt.vat : Number(p.vat_pct != null ? p.vat_pct : 21);
  const lines = [...projectQty(p)].map(([mid, qty]) => {
    const m = modelById(mid), rate = Number(m && m.day_rate || 0);
    return {m, qty, rate, sub: qty * rate * days};
  }).sort((a,b) => ((a.m&&a.m.name)||'').localeCompare((b.m&&b.m.name)||'', 'es'));
  const subtotal = lines.reduce((s,l) => s + l.sub, 0), dAmt = subtotal * disc / 100;
  const base = subtotal - dAmt, vatAmt = base * vat / 100;
  return {lines, days, disc, vat, subtotal, dAmt, base, vatAmt, total: base + vatAmt};
}
function modelStats(m){
  let shows = 0, income = 0; const now = Date.now();
  S.projects.forEach(p => {
    if (p.status === 'cancelled' || p.status === 'draft' || new Date(p.ends_at) > now) return;
    const qty = projectQty(p).get(m.id); if (!qty) return;
    shows++; income += qty * Number(m.day_rate || 0) * rentalDays(p) * (1 - Number(p.discount_pct || 0) / 100);
  });
  return {shows, income};
}

function resizeImage(file, max, type, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d');
      if (type === 'image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), type, q);
    };
    img.onerror = () => rej(new Error('img')); img.src = url;
  });
}

async function saveKitContents(kid){
  const rows = [];
  document.querySelectorAll('#sheet input[data-u]:checked').forEach(c => rows.push({kit_id:kid, unit_id:c.dataset.u, qty:1}));
  const bulk = [];
  document.querySelectorAll('#sheet input[data-b]').forEach(i => { const n = parseInt(i.value)||0; if (n > 0) bulk.push({model_id:i.dataset.b, n}); });
  if (!rows.length && !bulk.length) return toast('Elige qué añadir al kit', true);
  for (const b of bulk){      // nunca más de lo que hay en stock
    const m = modelById(b.model_id), av = kitBulkAvail(m);
    if (b.n > av) return toast(`No hay tantos «${m.name}»: quedan ${av} disponibles para kits (stock ${m.bulk_stock || 0}).`, true);
  }
  if (rows.length) await db(sb.from('kit_items').insert(rows));
  for (const b of bulk){
    const ex = S.kitItems.find(i => i.kit_id === kid && i.model_id === b.model_id);
    if (ex) await db(sb.from('kit_items').update({qty: ex.qty + b.n}).eq('id', ex.id));
    else await db(sb.from('kit_items').insert({kit_id:kid, model_id:b.model_id, qty:b.n}));
  }
  closeModal(); await loadAll(); toast('Kit actualizado');
}
// ¿Se puede reservar el kit en este show? Devuelve la lista de problemas
function kitProblem(p, kit){
  const probs = [], busy = busyUnits(p);
  const mine = new Set(S.reservations.filter(r => r.project_id === p.id && r.state !== 'returned').map(r => r.unit_id));
  const us = kitUnits(kit), bs = kitBulk(kit);
  if (!us.length && !bs.length) return ['el kit está vacío'];
  us.forEach(u => {
    if (u.status !== 'ok') probs.push(`${unitLabel(u)} está ${UNIT_STATUS[u.status].toLowerCase()}`);
    else if (busy.has(u.id)) probs.push(`${unitLabel(u)} está en otro show`);
    else if (mine.has(u.id)) probs.push(`${unitLabel(u)} ya está en este show`);
  });
  bs.forEach(b => { const f = bulkFree(p, b.model.id); if (f < b.qty) probs.push(`faltan ${b.model.name}: quedan ${f}, el kit lleva ${b.qty}`); });
  return probs;
}
async function reserveKit(pid, kid){
  const kit = kitById(kid);
  const uRows = kitUnits(kit).map(u => ({project_id:pid, unit_id:u.id, state:'planned', kit_id:kid}));
  const bRows = kitBulk(kit).map(b => ({project_id:pid, model_id:b.model.id, qty:b.qty, state:'planned', kit_id:kid}));
  if (uRows.length) await db(sb.from('reservations').insert(uRows));
  if (bRows.length){
    const r = await sb.from('bulk_reservations').insert(bRows);
    if (r.error){
      await sb.from('reservations').delete().eq('project_id', pid).eq('kit_id', kid);
      toast(errMsg(r.error), true); throw r.error;
    }
  }
}

async function saveProject(id){
  const name = $('#p-name').value.trim();
  if (!name) return toast('Escribe un nombre', true);
  const s = $('#p-start').value, e = $('#p-end').value;
  if (!s || !e) return toast('Indica las dos fechas', true);
  if (new Date(e) <= new Date(s)) return toast('La fecha final debe ser posterior a la inicial', true);
  const cl = await resolveClient(); if (cl === false) return;
  const payload = {name, client:cl.name, client_id:cl.id, venue:$('#p-venue').value.trim()||null,
    status:$('#p-status').value, starts_at:fromLocalInput(s), ends_at:fromLocalInput(e), notes:$('#p-notes').value.trim()||null, rider_notes:$('#p-rider').value.trim()||null};
  let pid = id;
  if (id){
    try { await db(sb.from('projects').update(payload).eq('id', id)); }
    catch(err){ if (err.code === '23P01') toast('No se pueden mover las fechas: alguna unidad ya está reservada en otro show en ese periodo.', true); return; }
  } else {
    const row = await db(sb.from('projects').insert(payload).select().single());
    pid = row.id;
  }
  if (payload.status === 'cancelled'){
    await db(sb.from('reservations').delete().eq('project_id', pid).neq('state','returned'));
    await db(sb.from('bulk_reservations').delete().eq('project_id', pid).neq('state','returned'));

  if (!id) openView('project', pid);

async function saveMaterial(pid){
  const p = projById(pid), uRows = [], bulk = [];
  document.querySelectorAll('#sheet input[data-m]').forEach(inp => {
    const n = parseInt(inp.value) || 0; if (n <= 0) return;
    if (inp.dataset.bulk === '1') bulk.push({model_id:inp.dataset.m, n});
    else freeUnits(p, inp.dataset.m).slice(0, n).forEach(u => uRows.push({project_id:pid, unit_id:u.id, state:'planned'}));
  });
  // comprobar TODO antes de guardar nada: si algo no cabe, no se añade nada
  for (const inp of document.querySelectorAll('#sheet input[data-m]')){
    const n = parseInt(inp.value) || 0; if (n <= 0) continue;
    const m = modelById(inp.dataset.m), free = m.is_bulk ? bulkFree(p, m.id) : freeUnits(p, m.id).length;
    if (n > free) return toast(`No hay tantos «${m.name}»: quedan ${free} libres en las fechas de este show.`, true);
  }
  if (!uRows.length && !bulk.length) return toast('Indica cuántas unidades quieres añadir', true);
  if (uRows.length) await db(sb.from('reservations').insert(uRows));
  for (const b of bulk){
    const ex = S.bulkRes.find(x => x.project_id === pid && x.model_id === b.model_id && !x.kit_id && x.state === 'planned');
    if (ex) await db(sb.from('bulk_reservations').update({qty: ex.qty + b.n}).eq('id', ex.id));
    else await db(sb.from('bulk_reservations').insert({project_id:pid, model_id:b.model_id, qty:b.n, state:'planned'}));
  }
  closeModal(); await loadAll(); toast('Material añadido');
}

// Enlace que abre Google Calendar con el evento ya rellenado (solo hay que pulsar Guardar)
function gcalUrl(p, opt = {}){
  const f = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const start = opt.start || p.starts_at;
  const details = [opt.role ? 'Función: ' + opt.role : '', p.client ? 'Cliente: ' + p.client : '', p.notes || ''].filter(Boolean).join('\n');
  const q = new URLSearchParams({action:'TEMPLATE', text:p.name + (opt.role ? ' (' + opt.role + ')' : ''), dates:f(start) + '/' + f(p.ends_at), details, location:p.venue || ''});
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}
function waLink(t, a, p){
  let ph = (t.phone||'').replace(/\D/g,'');
  if (ph.length === 9) ph = '34' + ph;
  const txt = [`Show: ${p.name}`, p.venue?`Lugar: ${p.venue}`:'', a.call_time?`Llamada: ${fmtDT(a.call_time)}`:`Inicio: ${fmtDT(p.starts_at)}`, a.role?`Función: ${a.role}`:'', 'Añadir a tu calendario: ' + gcalUrl(p, {start:a.call_time, role:a.role})].filter(Boolean).join('\n');
  return `https://wa.me/${ph}?text=${encodeURIComponent(txt)}`;
}

function printPackingList(pid){
  const p = projById(pid);
  const rs = S.reservations.filter(r => r.project_id === pid), bs = S.bulkRes.filter(b => b.project_id === pid);
  if (!rs.length && !bs.length) return toast('Este show aún no tiene material', true);
  const box = '<span class="box"></span>';
  const row = txt => `<tr><td style="width:12mm">${box}</td><td style="width:12mm">${box}</td><td>${txt}</td></tr>`;
  const head = `<tr><th>Sale</th><th>Vuelve</th><th>Material</th></tr>`;
  const kitIds = [...new Set([...rs, ...bs].map(x => x.kit_id).filter(Boolean))];
  let html = bizHeader() + `<h1>Lista de carga · ${esc(p.name)}</h1>
    <p>${esc(fmtFull(p.starts_at))} → ${esc(fmtFull(p.ends_at))}</p>
    <p>${esc([p.client, p.venue].filter(Boolean).join(' · '))}</p>`;
  if (kitIds.length){
    html += `<h2>Kits</h2><table>${head}` + kitIds.map(kid => {
      const k = kitById(kid);
      const inner = rs.filter(r => r.kit_id === kid).map(r => { const u = unitById(r.unit_id); return u ? esc(unitLabel(u)) + ' <span class="nw">' + esc(u.code) + '</span>' : ''; })
        .concat(bs.filter(b => b.kit_id === kid).map(b => { const m = modelById(b.model_id); return esc(m ? m.name : '') + ' ×' + b.qty; }));
      return row(`<b>${esc(k ? k.name : 'Kit')}</b>${k?` <span class="small nw">${esc(k.code)}</span>`:''}<br><span class="small">${inner.join(' · ')}</span>`);
    }).join('') + `</table>`;
  }
  const looseR = rs.filter(r => !r.kit_id), looseB = bs.filter(b => !b.kit_id);
  if (looseR.length){
    const byModel = {};
    looseR.forEach(r => { const u = unitById(r.unit_id); if (u) (byModel[u.model_id] = byModel[u.model_id] || []).push(u); });
    html += `<h2>Equipos</h2><table>${head}` + Object.keys(byModel).sort((a,b) => modelById(a).name.localeCompare(modelById(b).name,'es')).map(mid =>
      byModel[mid].map((u,i) => row(`${colorDot(modelById(mid))}<b>${esc(modelById(mid).name)}</b>${colorText(modelById(mid))?' <span class="small">· '+esc(colorText(modelById(mid)))+'</span>':''}${u.serial_number?' · '+esc(u.serial_number):''} <span class="small nw">${esc(u.code)}</span>`)).join('')).join('') + `</table>`;
  }
  if (looseB.length){
    html += `<h2>Material por cantidad</h2><table>${head}` + looseB.map(b => { const m = modelById(b.model_id); return row(`${colorDot(m)}<b>${esc(m?m.name:'')}</b> ×${b.qty}${colorText(m)?' <span class="small">· '+esc(colorText(m))+'</span>':''}`); }).join('') + `</table>`;
  }
  const as = S.assigns.filter(a => a.project_id === pid);
  if (as.length) html += `<h2>Equipo técnico</h2><table>` + as.map(a => { const t = techById(a.technician_id); return t ? `<tr><td>${esc(t.name)}</td><td>${esc(a.role||'')}</td><td>${a.call_time?esc(fmtDT(a.call_time)):''}</td><td>${esc(t.phone||'')}</td></tr>` : ''; }).join('') + `</table>`;
  const usedHex = new Set([...rs.map(r => (modelById((unitById(r.unit_id)||{}).model_id)||{}).color), ...bs.map(b => (modelById(b.model_id)||{}).color)].filter(Boolean));
  const leg = legendList().filter(e => usedHex.has(e.hex));
  if (leg.length) html += `<h2>Leyenda de colores</h2><p>${leg.map(e => `<span class="nw"><span class="sw" style="background:${esc(e.hex)}"></span>${esc(entryText(e))}</span>`).join(' &nbsp; ')}</p>`;
  printDoc('doc', html);
}

  openModal(`<h2>${id?'Editar técnico':'Nuevo técnico'}</h2>
    <label for="t-name">Nombre</label><input id="t-name" value="${esc(t.name||'')}">
    <label for="t-phone">Teléfono (para WhatsApp)</label><input id="t-phone" type="tel" value="${esc(t.phone||'')}">
    <label for="t-email">Email</label><input id="t-email" type="email" value="${esc(t.email||'')}">
    <button class="btn primary block" onclick="saveTech('${id||''}')">Guardar</button>`);
}
async function saveTech(id){
  const name = $('#t-name').value.trim();
  if (!name) return toast('Escribe un nombre', true);
  const payload = {name, phone:$('#t-phone').value.trim()||null, email:$('#t-email').value.trim()||null};
  if (id) await db(sb.from('technicians').update(payload).eq('id', id));
  else await db(sb.from('technicians').insert(payload));
  closeModal(); await loadAll(); toast('Guardado');
}
async function deleteTech(id){
  if (!confirm('¿Eliminar este técnico y sus asignaciones?')) return;
  await db(sb.from('technicians').delete().eq('id', id));
  S.view = null; await loadAll(); toast('Eliminado');
}

async function copyCal(){
  const el = $('#cal-url');
  try { await navigator.clipboard.writeText(el.value); toast('Enlace copiado'); }
  catch(e){ el.select(); toast('Selecciona y copia el enlace'); }
}
function downloadIcs(id){
  const t = techById(id);
  const stamp = d => new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const esc2 = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const ev = S.assigns.filter(a => a.technician_id === id).map(a => ({a, p:projById(a.project_id)})).filter(x => x.p && x.p.status !== 'cancelled');
  if (!ev.length) return toast('Este técnico no tiene shows asignados', true);
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mi material//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  ev.forEach(({a,p}) => {
    lines.push('BEGIN:VEVENT', 'UID:' + a.id + '@mi-material', 'DTSTAMP:' + stamp(Date.now()),
      'DTSTART:' + stamp(a.call_time || p.starts_at), 'DTEND:' + stamp(p.ends_at),
      'SUMMARY:' + esc2(p.name + (a.role ? ' (' + a.role + ')' : '')));
    if (p.venue) lines.push('LOCATION:' + esc2(p.venue));
    if (p.notes) lines.push('DESCRIPTION:' + esc2(p.notes));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  download(new Blob([lines.join('\r\n')], {type:'text/calendar'}), 'calendario-' + t.name.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '.ics');
}

let stream = null, camTimer = null, detector = null, lastCode = '', lastAt = 0, scanBusy = false;
function scanProjects(){
  const limit = Date.now() - 7*86400000;
  return S.projects.filter(p => p.status === 'confirmed' && new Date(p.ends_at) > limit).sort((a,b) => new Date(a.starts_at) - new Date(b.starts_at));
}
function scanView(){
  const ps = scanProjects();
  if (!ps.find(p => p.id === S.scan.project)) S.scan.project = (ps.find(p => new Date(p.ends_at) >= Date.now()) || ps[0] || {}).id || '';
  return bar('Escanear')
    + `<div class="pad" style="margin-top:12px">
      <div class="seg"><button id="m-out" onclick="setMode('out')">Salida</button><button id="m-in" onclick="setMode('in')">Devolución</button><button id="m-count" onclick="setMode('count')">Recuento</button></div>
      <div id="proj-wrap"><label for="scan-proj">Show al que sale el material</label>
        <select id="scan-proj" onchange="S.scan.project=this.value;updateProgress()">${ps.length?opts(ps.map(p=>[p.id,p.name+' · '+fmtD(p.starts_at)]), S.scan.project):'<option value="">No hay shows confirmados</option>'}</select></div>
      <div class="cam"><video id="cam" playsinline muted></video><div class="frame" id="frame" hidden></div><span id="cam-off">Cámara apagada</span></div>
      <button class="btn primary block" id="cam-btn" onclick="toggleCam()">Abrir cámara</button>
      <div id="scan-msg" class="msg">Escanea la etiqueta QR de un equipo o de un kit.</div>
      <div id="progress" class="sub" style="margin-top:8px"></div>
      <div id="count-actions" class="actions" style="margin:10px 0 0" hidden><button class="btn primary" onclick="openCountResult()">Ver resultado</button><button class="btn" onclick="resetCount()">Reiniciar recuento</button></div>
      <label class="chkrow" id="quick-wrap" hidden><input type="checkbox" id="quick" onchange="setQuick(this.checked)">Devolución rápida: marcar todo como completo sin preguntar</label>
      <label for="manual">O escribe el código a mano</label>
      <div style="display:flex;gap:8px"><input id="manual" placeholder="U-XXXXXXXX o K-XXXXXXXX" autocapitalize="characters" onkeydown="if(event.key==='Enter')manualCode()"><button class="btn" onclick="manualCode()">Aceptar</button></div>
      <div class="group" style="margin:20px 0 6px">Últimos escaneos</div><div class="list" style="margin:0" id="scan-log"></div>
    </div>`;
}
function afterScanRender(){
  setMode(S.scan.mode, true); renderLog(); updateProgress();
  if (stream){ const v = $('#cam'); v.srcObject = stream; v.play(); $('#cam-off').hidden = true; $('#frame').hidden = false; $('#cam-btn').textContent = 'Cerrar cámara'; }
}
function setMode(m, silent){
  S.scan.mode = m;
  ['out','in','count'].forEach(k => $('#m-' + k).classList.toggle('on', m === k));
  $('#proj-wrap').hidden = m !== 'out';
  $('#count-actions').hidden = m !== 'count';
  $('#quick-wrap').hidden = m !== 'in'; $('#quick').checked = quickReturn();
  if (m === 'count') scanMsgIdle('Recuento: escanea todo lo que haya en el almacén. No se modifica ningún dato.');
  if (!silent) updateProgress();
}
function scanMsgIdle(t){ const el = $('#scan-msg'); if (el && !S.scan.log.length){ el.textContent = t; el.className = 'msg'; } }
function expectedUnits(){
  const out = new Set(S.reservations.filter(r => r.state === 'out').map(r => r.unit_id));
  return S.units.filter(u => u.status !== 'lost' && u.status !== 'retired' && !out.has(u.id));
}
function updateProgress(){
  const el = $('#progress'); if (!el) return;
  if (S.scan.mode === 'count'){
    const exp = expectedUnits(), seen = exp.filter(u => S.count.seen.has(u.id)).length;
    el.innerHTML = `${seen} de ${exp.length} equipos del almacén contados` + `<div class="prog"><i style="width:${exp.length ? Math.round(100 * seen / exp.length) : 0}%"></i></div>`;
    return;
  }
  if (S.scan.mode !== 'out' || !S.scan.project){ el.textContent = ''; return; }
  const rs = S.reservations.filter(r => r.project_id === S.scan.project);
  const out = rs.filter(r => r.state === 'out').length, ret = rs.filter(r => r.state === 'returned').length;
  el.textContent = rs.length ? `${out} de ${rs.length} equipos fuera del almacén${ret?` · ${ret} devueltos`:''}` : 'Este show aún no tiene equipos reservados.';
}
function scanMsg(text, kind){
  const m = $('#scan-msg'); if (m){ m.textContent = text; m.className = 'msg ' + kind; }
  if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 60 : [80,60,80]);
  S.scan.log.unshift({text, kind, at:new Date()}); S.scan.log = S.scan.log.slice(0, 15); renderLog();
}
function renderLog(){
  const el = $('#scan-log'); if (!el) return;
  el.innerHTML = S.scan.log.length ? S.scan.log.map(l => `<div class="row"><div class="grow">${esc(l.text)}</div><span class="badge ${l.kind}">${l.at.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')
    : `<div class="row"><span class="sub">Todavía no has escaneado nada.</span></div>`;
}
async function toggleCam(){ stream ? stopCam() : await startCam(); }
async function startCam(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
  } catch(e){ stream = null; return toast('No se pudo abrir la cámara. Revisa los permisos del navegador.', true); }
  const v = $('#cam'); v.srcObject = stream; await v.play();
  $('#cam-off').hidden = true; $('#frame').hidden = false; $('#cam-btn').textContent = 'Cerrar cámara';
  detector = ('BarcodeDetector' in window) ? new BarcodeDetector({formats:['qr_code']}) : null;
  loopScan();
}
function stopCam(){
  clearTimeout(camTimer);
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $('#cam'); if (v) v.srcObject = null;
  const off = $('#cam-off'); if (off) off.hidden = false;
  const fr = $('#frame'); if (fr) fr.hidden = true;
  const b = $('#cam-btn'); if (b) b.textContent = 'Abrir cámara';
}
async function loopScan(){
  if (!stream) return;
  const v = $('#cam');
  if (v && v.readyState >= 2 && !scanBusy){
    let code = '';
    try {
      if (detector){ const r = await detector.detect(v); if (r.length) code = r[0].rawValue; }
      else {
        const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
        const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(v, 0, 0);
        const img = x.getImageData(0, 0, c.width, c.height);
        const r = jsQR(img.data, c.width, c.height); if (r) code = r.data;
      }
    } catch(e){}
    if (code && !(code === lastCode && Date.now() - lastAt < 2500)){
      lastCode = code; lastAt = Date.now();
      try { await handleCode(code); } catch(e){}
    }
  }
  camTimer = setTimeout(loopScan, 220);
}
function manualCode(){ const i = $('#manual'); if (i.value.trim()){ const c = i.value; i.value = ''; handleCode(c).catch(()=>{}); } }

async function handleCode(raw){
  if (scanBusy) return; scanBusy = true;
  try {
    const code = raw.trim().toUpperCase();
    if (S.scan.mode === 'count') return await handleCount(code);
    if (code.startsWith('K-')) return await handleKit(code);
    const u = S.units.find(x => x.code === code);
    if (!u) return scanMsg('Código no reconocido: ' + raw.trim(), 'bad');
    const label = unitLabel(u), off = !navigator.onLine, pend = off ? ' (pendiente de enviar)' : '';
    if (S.scan.mode === 'out'){
      const pid = S.scan.project;
      if (!pid) return scanMsg('Elige primero el show', 'bad');
      const res = S.reservations.find(r => r.unit_id === u.id && r.project_id === pid && r.state !== 'returned');
      if (res && res.state === 'out') return scanMsg('Ya estaba marcada como fuera: ' + label, 'warn');
      if (u.status !== 'ok') return scanMsg(label + ' está ' + UNIT_STATUS[u.status].toLowerCase() + '. No se puede sacar.', 'bad');
      if (!res){
        if (off) return scanMsg(label + ' no está reservada en este show y sin conexión no se puede añadir.', 'bad');
        if (!confirm(label + ' no está reservada en este show. ¿Añadirla ahora?')) return;
        const r = await sb.from('reservations').insert({project_id:pid, unit_id:u.id, state:'planned'}).select().single();
        if (r.error) return scanMsg(errMsg(r.error), 'bad');
        S.reservations.push(r.data);
      }
      enqueue({t:'out', unit_id:u.id, project_id:pid});
      updateProgress();
      scanMsg('Salida: ' + label + (u.missing_note ? ' · OJO, está incompleta: falta ' + u.missing_note : '') + pend, u.missing_note ? 'warn' : 'ok');
    } else {
      const res = S.reservations.find(r => r.unit_id === u.id && r.state === 'out');
      if (!res) return scanMsg(label + ' no consta como fuera del almacén.', 'warn');
      let c = {cond:'ok', note:''};
      if (!quickReturn()){
        const r = await askCondition([u], label);
        if (!r) return scanMsg('Devolución cancelada: ' + label, 'warn');
        c = r[0];
      }
      enqueue({t:'in', unit_id:u.id, cond:c.cond, note:c.note.trim(), clear:c.cond === 'ok' && !!u.missing_note});
      scanMsg('Devuelta: ' + label + (c.cond !== 'ok' ? ' · ' + COND[c.cond] + (c.note.trim() ? ': ' + c.note.trim() : '') : '') + pend, c.cond === 'ok' ? 'ok' : 'warn');
    }
  } finally { scanBusy = false; }
}
// Escaneo de un kit: mueve todo su contenido de una vez
async function handleKit(code){
  const kit = S.kits.find(k => k.code === code);
  if (!kit) return scanMsg('Kit no reconocido: ' + code, 'bad');
  const off = !navigator.onLine, pend = off ? ' (pendiente de enviar)' : '';
  if (S.scan.mode === 'out'){
    const pid = S.scan.project;
    if (!pid) return scanMsg('Elige primero el show', 'bad');
    const mine = () => ({rs:S.reservations.filter(r => r.project_id === pid && r.kit_id === kit.id), bs:S.bulkRes.filter(b => b.project_id === pid && b.kit_id === kit.id)});
    let {rs, bs} = mine();
    if (!rs.length && !bs.length){
      if (off) return scanMsg(`El kit «${kit.name}» no está reservado en este show y sin conexión no se puede añadir.`, 'bad');
      const probs = kitProblem(projById(pid), kit);
      if (probs.length) return scanMsg(`No se puede añadir el kit «${kit.name}»: ${probs[0]}.`, 'bad');
      if (!confirm(`El kit «${kit.name}» no está reservado en este show. ¿Añadirlo ahora?`)) return;
      await reserveKit(pid, kit.id); await loadAll(false); ({rs, bs} = mine());
    }
    const pendR = rs.filter(r => r.state === 'planned'), pendB = bs.filter(b => b.state === 'planned');
    if (!pendR.length && !pendB.length) return scanMsg(`El kit «${kit.name}» ya estaba fuera.`, 'warn');
    const bad = pendR.map(r => unitById(r.unit_id)).find(u => u && u.status !== 'ok');
    if (bad) return scanMsg(`${unitLabel(bad)} está ${UNIT_STATUS[bad.status].toLowerCase()}. No se puede sacar el kit.`, 'bad');
    const inc = pendR.map(r => unitById(r.unit_id)).filter(u => u && u.missing_note);
    enqueue({t:'kout', kit_id:kit.id, project_id:pid});
    updateProgress();
    scanMsg(`Salida del kit «${kit.name}»: ${pendR.length} equipos${pendB.length ? ` y ${pendB.length} línea${pendB.length===1?'':'s'} por cantidad` : ''}${inc.length ? ` · OJO: ${inc.length} incompleto${inc.length===1?'':'s'} (${inc.map(u => unitLabel(u) + ': falta ' + u.missing_note).join('; ')})` : ''}${pend}`, inc.length ? 'warn' : 'ok');
  } else {
    const rs = S.reservations.filter(r => r.kit_id === kit.id && r.state === 'out'), bs = S.bulkRes.filter(b => b.kit_id === kit.id && b.state === 'out');
    if (!rs.length && !bs.length) return scanMsg(`El kit «${kit.name}» no consta como fuera del almacén.`, 'warn');
    let items = rs.map(r => ({unit_id:r.unit_id, cond:'ok', note:'', clear:false}));
    if (rs.length && !quickReturn()){
      const r = await askCondition(rs.map(x => unitById(x.unit_id)).filter(Boolean), 'Kit «' + kit.name + '»');
      if (!r) return scanMsg(`Devolución del kit «${kit.name}» cancelada.`, 'warn');
      items = r.map(x => ({unit_id:x.unit_id, cond:x.cond, note:x.note.trim(), clear:x.cond === 'ok' && !!(unitById(x.unit_id) || {}).missing_note}));
    }
    enqueue({t:'kin', kit_id:kit.id, items});
    const inc = items.filter(i => i.cond !== 'ok').length;
    scanMsg(`Devuelto el kit «${kit.name}»: ${rs.length} equipos${bs.length ? ` y ${bs.length} línea${bs.length===1?'':'s'} por cantidad` : ''}${inc ? ` · ${inc} con incidencia` : ''}${pend}`, inc ? 'warn' : 'ok');
  }
}

function maintAlerts(){
  const out = [], limit = Date.now() + 30 * 86400000;
  S.units.forEach(u => {
    if (u.status === 'retired' || u.status === 'lost') return;
    const m = modelById(u.model_id); if (!m) return;
    if (u.missing_note) out.push({u, text:'Incompleto: falta ' + u.missing_note});
    if (u.next_service){
      const d = new Date(u.next_service + 'T12:00:00');
      if (d.getTime() <= limit) out.push({u, text: d < new Date() ? 'Revisión vencida desde el ' + fmtDay(u.next_service) : 'Revisión el ' + fmtDay(u.next_service)});
    }
    if (m.lamp_life_hours > 0 && Number(u.lamp_hours) >= 0.9 * m.lamp_life_hours)
      out.push({u, text:`Lámpara al ${Math.round(100 * Number(u.lamp_hours) / m.lamp_life_hours)}% (${u.lamp_hours} de ${m.lamp_life_hours} h)`});

}

/* ============ Recuento de inventario ============ */
async function handleCount(code){
  if (code.startsWith('K-')){
    const k = S.kits.find(x => x.code === code); if (!k) return scanMsg('Kit no reconocido: ' + code, 'bad');
    const us = kitUnits(k); us.forEach(u => S.count.seen.add(u.id)); updateProgress();
    return scanMsg(`Kit «${k.name}»: ${us.length} equipos contados`, 'ok');
  }
  const u = S.units.find(x => x.code === code);
  if (!u) return scanMsg('Código no reconocido: ' + code, 'bad');
  if (S.count.seen.has(u.id)) return scanMsg('Ya contada: ' + unitLabel(u), 'warn');
  S.count.seen.add(u.id); updateProgress();
  const out = S.reservations.some(r => r.unit_id === u.id && r.state === 'out');
  scanMsg(out ? unitLabel(u) + ' consta como FUERA, pero está aquí' : 'Contada: ' + unitLabel(u), out ? 'warn' : 'ok');
}
function resetCount(){
  if (S.count.seen.size && !confirm('¿Empezar el recuento de nuevo? Se olvidan los equipos ya escaneados.')) return;
  S.count.seen = new Set(); S.scan.log = []; renderLog(); updateProgress(); toast('Recuento reiniciado');
}
function openCountResult(){
  const exp = expectedUnits(), missing = exp.filter(u => !S.count.seen.has(u.id));
  const outButHere = S.units.filter(u => S.count.seen.has(u.id) && S.reservations.some(r => r.unit_id === u.id && r.state === 'out'));
  const counted = exp.length - missing.length;
  const byModel = {};
  missing.forEach(u => (byModel[u.model_id] = byModel[u.model_id] || []).push(u));
  const miss = Object.keys(byModel).sort((a,b) => modelById(a).name.localeCompare(modelById(b).name, 'es')).map(mid =>
    `<div class="row head"><div class="grow"><b>${esc(modelById(mid).name)}</b></div><div class="count">${byModel[mid].length}</div></div>` +
    byModel[mid].map(u => `<div class="row"><div class="grow">${u.serial_number ? esc(u.serial_number) : '<span class="sub">Sin nº de serie</span>'} <span class="code sub">${esc(u.code)}</span></div></div>`).join('')).join('');
  openModal(`<h2>Resultado del recuento</h2>
    <div class="info" style="margin:10px 0 0"><b>${counted}</b> de <b>${exp.length}</b> equipos contados${missing.length ? ` · <span style="color:var(--bad);font-weight:600">faltan ${missing.length}</span>` : ' · <span style="color:var(--ok);font-weight:600">no falta ninguno</span>'}
      <div class="sub" style="margin-top:4px">El material por cantidad no se cuenta aquí. Los equipos que están fuera en un show no se esperan en el almacén.</div></div>
    ${missing.length ? `<div class="group" style="margin:16px 0 6px">Faltan</div><div class="list" style="margin:0">${miss}</div>` : ''}
    ${outButHere.length ? `<div class="group" style="margin:16px 0 6px">Constaban fuera, pero están aquí</div><div class="list" style="margin:0">${outButHere.map(u => `<div class="row"><div class="grow">${esc(unitLabel(u))}</div></div>`).join('')}
      </div><div class="sub" style="margin-top:6px">Si ya volvieron, escanéalos en modo Devolución para actualizar su estado.</div>` : ''}`);
}

function setShowsMode(m){ S.showsMode = m; render(); window.scrollTo(0,0); }
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function calNav(n){ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth() + n, 1); S.calDay = null; render(); }
function calToday(){ const n = new Date(); S.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); S.calDay = ymd(n); render(); }
function selDay(k){ S.calDay = S.calDay === k ? null : k; render(); }
function calendarView(){
  if (!S.calMonth){ const n = new Date(); S.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); S.calDay = ymd(n); }
  const first = S.calMonth, mo = first.getMonth(), offset = (first.getDay() + 6) % 7;
  const all = Array.from({length:42}, (_, i) => new Date(first.getFullYear(), mo, 1 - offset + i));
  const days = all.slice(35).every(d => d.getMonth() !== mo) ? all.slice(0, 35) : all;
  const act = S.projects.filter(p => p.status !== 'cancelled');
  const projsOn = d => { const s = d.getTime(), e = s + 86400000; return act.filter(p => new Date(p.starts_at).getTime() < e && new Date(p.ends_at).getTime() >= s); };
  const info = days.map(d => { const ps = projsOn(d); return {d, ps, pc: ps.reduce((a, p) => a + pieces(p), 0)}; });
  const max = Math.max(1, ...info.map(x => x.pc)), todayK = ymd(new Date());
  const cells = info.map(({d, ps, pc}) => {
    const k = ymd(d);
    return `<button class="cal-day ${d.getMonth()!==mo?'off':''} ${k===todayK?'today':''} ${k===S.calDay?'sel':''}" onclick="selDay('${k}')"
      style="${pc?`background:color-mix(in srgb, var(--accent) ${Math.round(pc/max*38)}%, var(--panel))`:''}" aria-label="${d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}: ${ps.length} show${ps.length===1?'':'s'}">
      <span class="n">${d.getDate()}</span>
      <span class="dots">${ps.slice(0,3).map(p => `<i class="dot ${p.status==='draft'?'draft':p.status==='done'?'done':''}"></i>`).join('')}</span>
      ${pc?`<span class="pc">${pc}</span>`:''}</button>`;
  }).join('');
  let detail = '';
  if (S.calDay){
    const d = new Date(S.calDay + 'T00:00:00'), x = info.find(i => ymd(i.d) === S.calDay) || {ps:projsOn(d), pc:0};
    detail = `<div class="group">${esc(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}${x.pc?` · ${x.pc} piezas en uso`:''}</div>`
      + (x.ps.length ? `<div class="list">${x.ps.map(p => `<div class="row tap" onclick="openView('project','${p.id}')"><div class="grow"><b>${esc(p.name)}</b><div class="sub">${esc(fmtDT(p.starts_at))} → ${esc(fmtDT(p.ends_at))}</div></div><div class="count">${pieces(p)}</div></div>`).join('')}</div>`
        : `<div class="empty" style="margin:20px 24px">No hay shows este día.</div>`);
  }
  return bar('Shows', {actions:`<button class="btn primary small" onclick="openProjectForm()">+ Show</button>`}) + showsSeg()
    + `<div class="cal"><div class="cal-head"><button class="btn small" onclick="calNav(-1)" aria-label="Mes anterior">‹</button>
        <h2>${esc(first.toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./, c => c.toUpperCase()))}</h2>
        <button class="btn small" onclick="calToday()">Hoy</button><button class="btn small" onclick="calNav(1)" aria-label="Mes siguiente">›</button></div>
      <div class="cal-grid">${['L','M','X','J','V','S','D'].map(l => `<div class="cal-dow">${l}</div>`).join('')}${cells}</div>
      <div class="sub" style="margin-top:8px">El número de cada día son las piezas en uso. Cuanto más oscuro, más carga. Punto redondo: confirmado. Hueco: borrador. Cuadrado: hecho.</div></div>` + detail;
}

  const p = projById(pid), d = new Date(p.starts_at); d.setDate(d.getDate() + 7);
  openModal(`<h2>Duplicar show</h2><div class="sub">Se copia con la misma duración. Si una unidad está ocupada en las nuevas fechas, se sustituye por otra libre del mismo modelo.</div>
    <label for="d-name">Nombre</label><input id="d-name" value="${esc(p.name)} (copia)">

async function duplicateProject(pid){
  const p = projById(pid), name = $('#d-name').value.trim(), s = $('#d-start').value;
  if (!name || !s) return toast('Indica nombre y fecha', true);
  const newStart = new Date(s), dur = new Date(p.ends_at) - new Date(p.starts_at), shift = newStart - new Date(p.starts_at);
  const wantMat = $('#d-mat').checked, wantCrew = $('#d-crew').checked;
  const np = await db(sb.from('projects').insert({name, client:p.client, client_id:p.client_id || null, venue:p.venue, status:(p.status === 'done' || p.status === 'cancelled') ? 'confirmed' : p.status,
    notes:p.notes, starts_at:newStart.toISOString(), ends_at:new Date(newStart.getTime() + dur).toISOString(), rental_days:p.rental_days, discount_pct:p.discount_pct, vat_pct:p.vat_pct}).select().single());
  const report = [];
  if (wantMat){
    const rs = S.reservations.filter(r => r.project_id === pid), bs = S.bulkRes.filter(b => b.project_id === pid);
    const kitIds = [...new Set([...rs, ...bs].map(x => x.kit_id).filter(Boolean))];
    for (const kid of kitIds){
      const k = kitById(kid); if (!k) continue;
      const probs = kitProblem(np, k);
      if (probs.length){ report.push(`Kit «${k.name}»: ${probs[0]}`); continue; }
      try { await reserveKit(np.id, kid); } catch(e){ report.push(`Kit «${k.name}»: no se pudo reservar`); }
      await loadAll(false);
    }
    const taken = new Set(S.reservations.filter(r => r.project_id === np.id).map(r => r.unit_id)), rows = [];
    for (const r of rs.filter(r => !r.kit_id)){
      const u = unitById(r.unit_id); if (!u) continue;
      const free = freeUnits(np, u.model_id).filter(x => !taken.has(x.id)), pick = free.find(x => x.id === u.id) || free[0];
      if (!pick){ report.push('Sin unidad libre de ' + modelById(u.model_id).name); continue; }
      taken.add(pick.id); rows.push({project_id:np.id, unit_id:pick.id, state:'planned'});
    }
    if (rows.length) await db(sb.from('reservations').insert(rows));
    const want = {};
    bs.filter(b => !b.kit_id).forEach(b => want[b.model_id] = (want[b.model_id] || 0) + b.qty);
    for (const mid of Object.keys(want)){
      const free = bulkFree(np, mid), n = Math.min(free, want[mid]);
      if (n < want[mid]) report.push(`${modelById(mid).name}: solo quedan ${free} de ${want[mid]}`);
      if (n > 0) await db(sb.from('bulk_reservations').insert({project_id:np.id, model_id:mid, qty:n, state:'planned'}));
    }
  }
  if (wantCrew){
    const as = S.assigns.filter(a => a.project_id === pid).map(a => ({project_id:np.id, technician_id:a.technician_id, role:a.role, call_time:a.call_time ? new Date(new Date(a.call_time).getTime() + shift).toISOString() : null}));
    if (as.length) await db(sb.from('crew_assignments').insert(as));
  }
  await loadAll();
  if (report.length){
    openModal(`<h2>Show duplicado</h2><div class="sub">Se ha copiado todo, salvo:</div>
      <div class="list" style="margin:12px 0">${report.map(t => `<div class="row">${esc(t)}</div>`).join('')}</div>
      <button class="btn primary block" onclick="closeModal();openView('project','${np.id}')">Ver el show</button>`);
  } else { closeModal(); openView('project', np.id); toast('Show duplicado'); }
}

/* ============ IMPORTAR DESDE EXCEL / CSV ============ */
const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const IMPORT_HEAD = {
  model:['modelo','nombre','equipo','model','name'], brand:['marca','brand','fabricante'], cat:['categoria','category'],
  serial:['n de serie','numero de serie','serie','serial','serial number','sn'], qty:['cantidad','qty','unidades','stock'],
  rate:['tarifa','tarifa por dia','precio dia','precio','rate'], type:['tipo','type']
};
let importPlan = null;
function openImport(){
  importPlan = null;
  openModal(`<h2>Importar inventario</h2>
    <div class="sub">Sube un Excel (.xlsx) o un CSV. Se lee la primera hoja. Columnas: <b>Modelo</b> (obligatoria), Marca, Categoría, Nº de serie, Cantidad, Tarifa por día y Tipo.</div>
    <div class="info" style="margin:10px 0 0;font-size:14px">Una fila con nº de serie crea una unidad con ese número. Una fila sin nº de serie crea tantas unidades en blanco como indique Cantidad. Si en Tipo pones «cantidad», el modelo se crea como material por cantidad (cables, consumibles) con ese stock. Los números de serie que ya existen se saltan.</div>
    <div class="actions" style="margin:12px 0 0"><button class="btn" onclick="downloadTemplate()">Descargar plantilla</button></div>
    <label for="i-file">Archivo</label><input id="i-file" type="file" accept=".xlsx,.xls,.csv,text/csv" onchange="readImport(this)">
    <div id="i-sum"></div>`);
}
function downloadTemplate(){
  if (typeof XLSX === 'undefined') return toast('No se pudo cargar el generador de Excel.', true);
  const ws = XLSX.utils.aoa_to_sheet([
    ['Modelo','Marca','Categoría','Nº de serie','Cantidad','Tarifa por día','Tipo'],
    ['Robin 300 Wash','Robe','Iluminación','RB-30418','',35,''],
    ['Robin 300 Wash','Robe','Iluminación','RB-30419','',35,''],
    ['Foco PAR LED','Chauvet','Iluminación','',6,12,''],
    ['Cable XLR 5 m','','Audio','',40,0.5,'cantidad']]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  XLSX.writeFile(wb, 'plantilla-inventario.xlsx');
}
async function readImport(input){
  const f = input.files && input.files[0]; if (!f) return;
  if (typeof XLSX === 'undefined') return toast('No se pudo cargar el lector de Excel. Comprueba tu conexión.', true);
  try {
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array', codepage:65001});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    importPlan = buildImportPlan(rows);
  } catch(e){ importPlan = {error:'No se pudo leer el archivo.'}; }
  const el = $('#i-sum'); if (!el) return;
  if (importPlan.error){ el.innerHTML = `<div class="msg bad">${esc(importPlan.error)}</div>`; return; }
  const g = importPlan.groups, news = g.filter(x => !x.existing).length;
  const units = g.reduce((s, x) => s + x.newSerials.length + x.blank, 0), bulk = g.filter(x => x.bulk).length;
  el.innerHTML = `<div class="msg ok" style="margin-top:12px">${g.length} modelo${g.length===1?'':'s'} (${news} nuevo${news===1?'':'s'}) · ${units} unidad${units===1?'':'es'} nueva${units===1?'':'s'}${bulk?` · ${bulk} por cantidad`:''}${importPlan.ignored?` · ${importPlan.ignored} fila${importPlan.ignored===1?'':'s'} sin modelo ignorada${importPlan.ignored===1?'':'s'}`:''}${importPlan.skipped?` · ${importPlan.skipped} nº de serie ya existente${importPlan.skipped===1?'':'s'} saltado${importPlan.skipped===1?'':'s'}`:''}</div>
    <div class="list" style="margin:12px 0 0">${g.slice(0, 8).map(x => `<div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="sub">${esc([x.brand, x.cat].filter(Boolean).join(' · '))}</div></div>
      <span class="badge ${x.existing?'':'ok'}">${x.existing?'Ya existe':'Nuevo'}</span><div class="sub">${x.bulk?'×'+x.stock:'+'+(x.newSerials.length+x.blank)}</div></div>`).join('')}
      ${g.length > 8 ? `<div class="row sub">…y ${g.length - 8} más</div>` : ''}</div>
    <button class="btn primary block" onclick="runImport()">Importar ahora</button>`;
}
function buildImportPlan(rows){
  const keys = [...new Set(rows.flatMap(r => Object.keys(r)))], col = {};
  Object.entries(IMPORT_HEAD).forEach(([f, list]) => col[f] = keys.find(k => list.includes(norm(k))));
  if (!col.model) return {error:'No encuentro la columna «Modelo». Usa la plantilla para ver el formato.'};
  const groups = new Map(); let ignored = 0, skipped = 0;
  rows.forEach(r => {
    const name = String(r[col.model] || '').trim(); if (!name){ ignored++; return; }
    const brand = col.brand ? String(r[col.brand] || '').trim() : '', key = norm(name) + '|' + norm(brand);
    const g = groups.get(key) || {name, brand, cat:'', rate:null, bulk:false, stock:0, serials:[], blank:0};
    if (col.cat && String(r[col.cat]).trim()) g.cat = String(r[col.cat]).trim();
    if (col.rate && String(r[col.rate]).trim() !== ''){ const v = parseFloat(String(r[col.rate]).replace(',', '.')); if (!isNaN(v)) g.rate = v; }
    const type = col.type ? norm(r[col.type]) : '', serial = col.serial ? String(r[col.serial] || '').trim() : '', qty = col.qty ? (parseInt(r[col.qty]) || 0) : 0;
    if (type.startsWith('cantidad') || type.startsWith('bulk')){ g.bulk = true; g.stock += qty || 1; }
    else if (serial) g.serials.push(serial);
    else g.blank += qty > 0 ? qty : 1;
    groups.set(key, g);
  });
  const list = [...groups.values()].map(g => {
    const existing = S.models.find(m => norm(m.name) === norm(g.name) && (!g.brand || norm(m.brand) === norm(g.brand)));
    const have = new Set(existing ? S.units.filter(u => u.model_id === existing.id).map(u => norm(u.serial_number)) : []);
    const seen = new Set(), newSerials = [];
    g.serials.forEach(s => { if (have.has(norm(s)) || seen.has(norm(s))){ skipped++; return; } seen.add(norm(s)); newSerials.push(s); });
    return {...g, existing, newSerials};
  });
  if (!list.length) return {error:'No hay filas con modelo en el archivo.'};
  return {groups:list, ignored, skipped};
}
async function insertChunks(table, rows, size = 300){
  const out = [];
  for (let i = 0; i < rows.length; i += size) out.push(...await db(sb.from(table).insert(rows.slice(i, i + size)).select()));
  return out;
}
async function runImport(){
  if (!importPlan || importPlan.error) return;
  toast('Importando…');
  const plan = importPlan, catMap = {};
  S.categories.forEach(c => catMap[norm(c.name)] = c.id);
  const newCats = [...new Set(plan.groups.map(g => g.cat).filter(c => c && !catMap[norm(c)]))];
  if (newCats.length) (await insertChunks('categories', newCats.map(name => ({name})))).forEach(c => catMap[norm(c.name)] = c.id);
  const mk = g => norm(g.name) + '|' + norm(g.brand), modelIds = {};
  plan.groups.filter(g => g.existing).forEach(g => modelIds[mk(g)] = g.existing.id);
  const fresh = plan.groups.filter(g => !g.existing);
  if (fresh.length){
    const made = await insertChunks('equipment_models', fresh.map(g => ({name:g.name, brand:g.brand || null, category_id:g.cat ? catMap[norm(g.cat)] : null, day_rate:g.rate, is_bulk:g.bulk, bulk_stock:g.bulk ? g.stock : 0})));
    made.forEach(m => modelIds[norm(m.name) + '|' + norm(m.brand)] = m.id);
  }
  for (const g of plan.groups.filter(g => g.existing)){
    const up = {};
    if (g.rate != null) up.day_rate = g.rate;
    if (g.bulk && g.existing.is_bulk) up.bulk_stock = g.stock;
    if (Object.keys(up).length) await db(sb.from('equipment_models').update(up).eq('id', g.existing.id));
  }
  const unitRows = [];
  plan.groups.forEach(g => {
    if (g.bulk) return;
    const id = modelIds[mk(g)]; if (!id) return;
    g.newSerials.forEach(s => unitRows.push({model_id:id, serial_number:s}));
    for (let i = 0; i < g.blank; i++) unitRows.push({model_id:id});
  });
  if (unitRows.length) await insertChunks('units', unitRows, 500);
  importPlan = null; closeModal(); await loadAll();
  toast(`Importado: ${plan.groups.length} modelos y ${unitRows.length} unidades`);
}

/* ============ LEYENDA DE COLORES (cables) ============ */
const COMMON_COLORS = [['#E53935','Rojo'],['#1E66F5','Azul'],['#43A047','Verde'],['#FDD835','Amarillo'],['#FB8C00','Naranja'],['#FFFFFF','Blanco'],['#212121','Negro'],['#8E24AA','Morado'],['#EC407A','Rosa'],['#9E9E9E','Gris'],['#795548','Marrón'],['#00ACC1','Turquesa'],['#C0CA33','Lima'],['#3949AB','Azul oscuro']];
const legendList = () => Array.isArray(S.settings && S.settings.color_legend) ? S.settings.color_legend : [];
const colorEntry = hex => hex ? legendList().find(e => e.hex && e.hex.toLowerCase() === String(hex).toLowerCase()) : null;
// Nombre del color a partir del código hexadecimal (para no depender de verlo)
function autoName(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return '';
  const n = parseInt(m[1], 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  let hh = 0;
  if (d){ hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60; if (hh < 0) hh += 360; }
  if (l < 0.13) return 'negro';
  if (l > 0.92 && s < 0.5) return 'blanco';
  if (s < 0.12) return l < 0.35 ? 'gris oscuro' : l > 0.7 ? 'gris claro' : 'gris';
  let base;
  if (hh < 15 || hh >= 345) base = l > 0.72 ? 'rosa' : 'rojo';
  else if (hh < 45) base = l < 0.42 ? 'marrón' : (l > 0.78 && s < 0.7 ? 'beige' : 'naranja');
  else if (hh < 62) base = 'amarillo';
  else if (hh < 90) base = 'lima';
  else if (hh < 165) base = 'verde';
  else if (hh < 195) base = 'turquesa';
  else if (hh < 215) base = 'celeste';
  else if (hh < 255) base = 'azul';
  else if (hh < 285) base = 'violeta';
  else if (hh < 325) base = 'morado';
  else base = 'rosa';
  return base + (['marrón', 'beige', 'rosa'].includes(base) ? '' : l < 0.28 ? ' oscuro' : l > 0.75 ? ' claro' : '');
}
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const entryName = e => (e && e.name) || cap(autoName(e && e.hex));
const colorName = hex => { const e = colorEntry(hex); return e && e.name ? e.name : cap(autoName(hex)); };
const colorLabel = m => { const e = m && colorEntry(m.color); return e ? (e.label || '') : ''; };
const colorText = m => m && m.color ? [colorName(m.color), colorLabel(m)].filter(Boolean).join(' · ') : '';
const entryText = e => [entryName(e), e.label].filter(Boolean).join(' · ');
const colorDot = m => m && m.color ? `<span class="sw" style="background:${esc(m.color)}" title="${esc(colorText(m))}"></span>` : '';
function legendChips(){
  const l = legendList().filter(e => e.hex);
  return l.length ? `<div class="legend">${l.map(e => `<span class="chip"><span class="sw" style="background:${esc(e.hex)}"></span>${esc(entryText(e))}</span>`).join('')}</div>` : '';
}
function colorPicker(sel){
  const l = legendList().filter(e => e.hex), same = (a, b) => a && b && a.toLowerCase() === b.toLowerCase();
  if (!l.length) return '<span class="sub">Aún no hay leyenda. Créala en Más > Leyenda de colores.</span>';
  const extra = sel && !l.some(e => same(e.hex, sel)) ? [{hex:sel, label:'fuera de la leyenda'}] : [];
  return `<button type="button" class="chip ${!sel?'sel':''}" onclick="pickColor('')">Sin color</button>`
    + [...l, ...extra].map(e => `<button type="button" class="chip ${same(e.hex, sel)?'sel':''}" onclick="pickColor('${esc(e.hex)}')"><span class="sw" style="background:${esc(e.hex)}"></span>${esc(entryText(e))}</button>`).join('');
}
function pickColor(hex){ $('#f-color').value = hex; $('#f-colors').innerHTML = colorPicker(hex); }
let legendDraft = [], legendOpen = -1;
function openLegend(){ legendDraft = legendList().map(e => ({hex:e.hex, name:e.name || '', label:e.label || ''})); legendOpen = -1; drawLegend(); }
function drawLegend(){
  const rows = legendDraft.map((e, i) => `<div class="lg-row"><button type="button" class="swbtn ${legendOpen===i?'open':''}" style="background:${esc(e.hex)}" onclick="legendPalette(${i})" aria-label="Cambiar color ${i+1}, ahora ${esc(entryName(e))}"></button>
    <input value="${esc(e.label)}" placeholder="Qué significa (ej. 5 m)" oninput="legendDraft[${i}].label=this.value" aria-label="Significado del color ${i+1}">
    <button class="btn small" aria-label="Quitar color" onclick="legendRemove(${i})">✕</button></div>
    <div class="sub" style="margin:3px 0 0 54px">Color: <b>${esc(entryName(e))}</b></div>`
    + (legendOpen === i ? `<div class="pal">${COMMON_COLORS.map(([c, n]) => `<button type="button" class="chip ${c.toLowerCase()===e.hex.toLowerCase()?'sel':''}" onclick="legendSetColor(${i},'${c}','${n}')"><span class="sw" style="background:${c}"></span>${n}</button>`).join('')}
      <label>Otro color <input type="color" value="${esc(e.hex)}" onchange="legendSetColor(${i},this.value,'')"></label></div>` : '')).join('');
  openModal(`<h2>Leyenda de colores</h2>
    <div class="sub">Toca un color para cambiarlo: cada uno lleva su nombre escrito. Después escribe qué significa en tus cables (por ejemplo, la longitud) y asigna un color a cada modelo al editarlo.</div>
    ${rows || '<div class="empty" style="margin:20px 0">Aún no hay colores en la leyenda.</div>'}
    <div class="actions" style="margin:12px 0 0"><button class="btn" onclick="legendAdd()">+ Añadir color</button><button class="btn" onclick="legendCommon()">Añadir colores típicos</button></div>
    <button class="btn primary block" onclick="saveLegend()">Guardar leyenda</button>`);
}
function legendPalette(i){ legendOpen = legendOpen === i ? -1 : i; drawLegend(); }
function legendSetColor(i, hex, name){ legendDraft[i].hex = hex; legendDraft[i].name = name; legendOpen = -1; drawLegend(); }
function legendAdd(){ legendDraft.push({hex:'#E53935', name:'Rojo', label:''}); legendOpen = legendDraft.length - 1; drawLegend(); }
function legendRemove(i){ legendDraft.splice(i, 1); legendOpen = -1; drawLegend(); }
function legendCommon(){
  COMMON_COLORS.slice(0, 9).forEach(([hex, name]) => { if (!legendDraft.some(e => e.hex.toLowerCase() === hex.toLowerCase())) legendDraft.push({hex, name, label:''}); });
  drawLegend();
}
async function saveLegend(){
  const l = legendDraft.map(e => ({hex:e.hex, name:e.name || entryName(e), label:e.label.trim()}));
  const seen = new Set();
  for (const e of l){ const k = e.hex.toLowerCase(); if (seen.has(k)) return toast('Hay dos entradas con el mismo color. Quita una.', true); seen.add(k); }
  await db(sb.from('settings').upsert({id:1, color_legend:l, updated_at:new Date().toISOString()}));
  closeModal(); await loadAll(); toast('Leyenda guardada');
}
