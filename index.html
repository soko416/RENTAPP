/* ============ LISTA DE MATERIAL FUERA (devolver a mano) ============ */
S.outOpen = false; S.outSel = new Set(); S.outQty = {};
// Todo lo que está fuera, agrupado por show; los kits van como una sola fila
function outGroups(){
  const groups = new Map();
  const grp = pid => { if (!groups.has(pid)) groups.set(pid, {p:projById(pid), kits:new Map(), units:[], bulks:[]}); return groups.get(pid); };
  S.reservations.filter(r => r.state === 'out').forEach(r => {
    const u = unitById(r.unit_id); if (!u) return; const g = grp(r.project_id), k = r.kit_id ? kitById(r.kit_id) : null;
    if (k){ const e = g.kits.get(k.id) || {kit:k, units:[], bulks:[]}; e.units.push(u); g.kits.set(k.id, e); } else g.units.push({r, u});
  });
  S.bulkRes.filter(b => b.state === 'out').forEach(b => {
    const g = grp(b.project_id), k = b.kit_id ? kitById(b.kit_id) : null;
    if (k){ const e = g.kits.get(k.id) || {kit:k, units:[], bulks:[]}; e.bulks.push(b); g.kits.set(k.id, e); } else g.bulks.push(b);
  });
  return [...groups.values()].filter(g => g.p).sort((a, b) => new Date(a.p.starts_at) - new Date(b.p.starts_at));
}
const outKeys = g => [...g.units.map(x => 'r:' + x.r.id), ...[...g.kits.keys()].map(id => `k:${g.p.id}:${id}`), ...g.bulks.map(b => 'b:' + b.id)];
const outPieces = () => S.reservations.filter(r => r.state === 'out').length + S.bulkRes.filter(b => b.state === 'out').reduce((s, b) => s + b.qty, 0);
function toggleOutList(){ S.outOpen = !S.outOpen; renderOutList(); }
function renderOutList(){
  const btn = $('#out-toggle'); if (!btn) return;
  btn.textContent = (S.outOpen ? '▾ ' : '▸ ') + `Material fuera (${outPieces()})`;
  const el = $('#out-list'); el.hidden = !S.outOpen; if (!S.outOpen) return;
  const groups = outGroups(), valid = new Set(groups.flatMap(outKeys));
  [...S.outSel].forEach(k => { if (!valid.has(k)) S.outSel.delete(k); });          // lo que ya no está fuera se desmarca
  if (!groups.length){ el.innerHTML = '<div class="sub" style="margin-top:12px">No hay nada fuera del almacén.</div>'; return; }
  const row = (key, title, sub, extra, search, lead) => { const sel = S.outSel.has(key);
    return `<div class="row ${sel ? 'done' : ''}" data-s="${esc(search.toLowerCase())}"><label class="chkrow grow" style="padding:0"><input type="checkbox" data-key="${key}" ${sel ? 'checked' : ''} onchange="toggleOut('${key}',this.checked)">${lead || ''}<span class="grow"><b>${title}</b><span class="sub" style="display:block">${sub}</span></span></label>${extra || ''}</div>`; };
  el.innerHTML = `<div class="search" style="margin:10px 0 0"><input type="search" placeholder="Buscar en lo que está fuera" oninput="filterRows(this.value)"></div>`
    + groups.map(g => {
      const all = outKeys(g).every(k => S.outSel.has(k)), cats = {};

function toggleLoad(kind, id, on){

function loadAllMark(pid, on){
  const L = loadModel(projById(pid)), ops = []; let skipped = 0;
  if (on){
    L.kits.forEach(e => { if (!e.rs.concat(e.bs).some(x => x.state === 'planned')) return;
      if (e.rs.some(r => r.state === 'planned' && (unitById(r.unit_id) || {}).status !== 'ok')){ skipped++; return; }
      ops.push({t:'kout', kit_id:e.kit.id, project_id:pid}); });
    L.units.forEach(({r, u}) => { if (r.state !== 'planned') return; if (u.status !== 'ok'){ skipped++; return; } ops.push({t:'out', unit_id:u.id, project_id:pid}); });
    L.bulks.forEach(({b}) => { if (b.state === 'planned') ops.push({t:'bout', bulk_id:b.id, qty:b.qty, expect:b.qty}); });
  } else {
    if (!confirm('¿Desmarcar todo lo cargado? El material volverá a estar pendiente de cargar. (Lo ya devuelto no cambia.)')) return;
    L.kits.forEach(e => { if (e.rs.concat(e.bs).some(x => x.state === 'out')) ops.push({t:'kundo', kit_id:e.kit.id, project_id:pid}); });
    L.units.forEach(({r, u}) => { if (r.state === 'out') ops.push({t:'uundo', unit_id:u.id, project_id:pid}); });
    L.bulks.forEach(({b}) => { if (b.state === 'out') ops.push({t:'bundo', bulk_id:b.id}); });
  }
  if (!ops.length) return toast(on ? 'No queda nada por cargar.' : 'No hay nada cargado que desmarcar.');
  enqueueMany(ops); render();
  if (skipped) toast(`${skipped} elemento${skipped === 1 ? '' : 's'} no se ha cargado porque no está operativo.`, true);
}

// Las marcas salen de los modelos que ya has creado: cada marca nueva queda disponible para la próxima vez
function brandList(){
  const seen = new Map();
  S.models.forEach(m => { const b = String(m.brand || '').trim(), k = norm(b); if (b && !seen.has(k)) seen.set(k, b); });
  return [...seen.values()].sort((a, b) => a.localeCompare(b, 'es'));
}
// Si escribes «robe» y ya existe «Robe», se usa la que ya existe (así no hay duplicados por mayúsculas)
function canonBrand(v){
  const b = String(v || '').trim().replace(/\s+/g, ' '); if (!b) return null;

  return old || b;

/* ============ BUSCAR UNA UNIDAD POR CÓDIGO O POR Nº DE SERIE ============ */
const compactStr = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
// Acepta el código interno (U-…) o el número de serie (LB001, lb-001…). Si el número de serie lo comparten
// varias unidades, se queda con la que tiene sentido en ese momento (reservada en el show elegido, o fuera del almacén).
function findUnitByInput(raw){
  const code = String(raw || '').trim().toUpperCase();
  const byCode = S.units.find(x => x.code === code); if (byCode) return {u:byCode};
  const k = compactStr(raw); if (!k) return {};
  let hits = S.units.filter(x => (x.serial_number && compactStr(x.serial_number) === k) || (x.manufacturer_serial && compactStr(x.manufacturer_serial) === k));
  if (hits.length > 1){
    const mode = S.scan.mode;
    const pref = mode === 'out' ? hits.filter(x => S.reservations.some(r => r.unit_id === x.id && r.project_id === S.scan.project && r.state !== 'returned'))
      : mode === 'in' ? hits.filter(x => S.reservations.some(r => r.unit_id === x.id && r.state === 'out')) : [];
    if (pref.length) hits = pref;
  }
  if (hits.length === 1) return {u:hits[0]};
  return hits.length > 1 ? {many:hits} : {};
}

/* ============ UNIR LÍNEAS REPETIDAS DE MATERIAL POR CANTIDAD ============ */
// Mismo show + mismo material + mismo kit + mismo estado = una sola línea (p. ej. «Cable ×2» y «Cable ×18» fuera → «Cable ×20»)
function hasBulkDupes(){
  const seen = new Set();
  return S.bulkRes.some(b => {
    if (String(b.id).startsWith('tmp-')) return false;
    const k = [b.project_id, b.model_id, b.kit_id || '', b.state].join('|');
    if (seen.has(k)) return true; seen.add(k); return false;
  });
}
// La unión la hace la base de datos en una sola operación (esquema_v7.sql). Solo se pide cuando hay conexión y nada pendiente de enviar.
async function mergeBulk(){
  if (typeof sb.rpc !== 'function') return 0;
  const r = await sb.rpc('merge_bulk_lines');
  if (r.error){ if (isSchemaErr(r.error)) S.mergeOff = true; return 0; }
  return r.data || 0;
}
function autoMergeBulk(){
  if (S.merging || S.mergeOff || (S.mergeTries || 0) >= 5) return;
  if (!navigator.onLine || S.queue.length || !S.session || S.session.offline || !hasBulkDupes()) return;
  S.merging = true; S.mergeTries = (S.mergeTries || 0) + 1;
  mergeBulk().then(n => { S.merging = false; if (n > 0) loadAll(true); }).catch(() => { S.merging = false; });
}

/* ============ INCIDENCIAS TOTALES ============ */
// Incidencias = lo que está fuera de servicio (roto, perdido o de baja; en cables, los que están en reparación) + lo marcado como incompleto.
// Es la misma cuenta que suman las insignias de la lista de Material.
function incidenceStats(){
  let bad = 0, inc = 0;
  S.units.forEach(u => { if (u.status !== 'ok') bad++; if (u.missing_note) inc++; });
  S.models.forEach(m => { if (m.is_bulk) bad += bulkRepair(m); });
  S.kits.forEach(k => { if (k.missing_note) inc++; });
  return {bad, inc, total:bad + inc};
}

function incidenceBreakdown(s){

}

/* ============ ORDEN DE LOS MODELOS: por nombre y por tamaño ============ */
// El tamaño en metros que aparece en el nombre (3M, 10 m, 0,5m…) y el nombre sin ese tamaño: «Cable DMX 5p 3M» → «Cable DMX 5p» y 3
function modelSize(name){
  const s = String(name || ''), re = /(\d+(?:[.,]\d+)?)\s*(?:m|mt|mts|metros?)\b/gi;
  let x, last = null; while ((x = re.exec(s))) last = x;
  if (!last) return {size:null, family:s.trim()};
  return {size:parseFloat(last[1].replace(',', '.')), family:(s.slice(0, last.index) + ' ' + s.slice(last.index + last[0].length)).replace(/\s+/g, ' ').trim()};
}
// Primero por nombre (todos los «Cable DMX 5p» juntos) y dentro de cada nombre, del más corto al más largo (1 m, 3 m, 5 m… 25 m)
function modelCmp(a, b){
  const x = modelSize(a.name), y = modelSize(b.name);
  return x.family.localeCompare(y.family, 'es', {numeric:true})
    || (x.size == null ? 1e9 : x.size) - (y.size == null ? 1e9 : y.size)
    || String(a.name || '').localeCompare(String(b.name || ''), 'es', {numeric:true});
}

/* ============ ORDEN DE LAS CATEGORÍAS ============ */
// Primero las que tienen orden (por su número) y, si no hay número, alfabéticamente

/* ============ GESTIONAR MARCAS ============ */
// Marcas agrupadas sin distinguir mayúsculas ni acentos: «Thomann» y «thomann» son la misma marca escrita de dos formas
function brandGroups(){
  const g = new Map();
  S.models.forEach(m => { const b = String(m.brand || '').trim(); if (!b) return; const k = norm(b); const e = g.get(k) || {key:k, variants:new Map(), ids:[]};
    e.variants.set(b, (e.variants.get(b) || 0) + 1); e.ids.push(m.id); g.set(k, e); });
  return [...g.values()].map(e => { const cap = v => /^[A-ZÁÉÍÓÚÑ]/.test(v) && v !== v.toUpperCase() ? 0 : 1;          // en un empate gana «Thomann» sobre «thomann» y «THOMANN»
    const vs = [...e.variants.entries()].sort((a, b) => b[1] - a[1] || cap(a[0]) - cap(b[0]) || a[0].localeCompare(b[0], 'es')); return {key:e.key, name:vs[0][0], variants:vs.map(v => v[0]), ids:e.ids}; })
    .sort((a, b) => a.name.localeCompare(b.name, 'es'));
}
function openBrands(){
  const g = brandGroups();
  openModal(`<h2>Marcas</h2><div class="sub">Renombra una marca o únela con otra: el cambio se aplica a todos los modelos que la usan. Si una marca está escrita de varias formas, puedes unificarla.</div>

S.av = {from:'', to:'', only:false};
const availDay = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
// Rango consultado: del primer día a las 00:00 al último a las 23:59
function availRange(){
  const f = S.av.from || todayStr(), t = S.av.to || f; let a = new Date(f + 'T00:00:00'), b = new Date(t + 'T23:59:59');
  if (b < a){ a = new Date(t + 'T00:00:00'); b = new Date(f + 'T23:59:59'); }
  return {id:'__avail', starts_at:a.toISOString(), ends_at:b.toISOString(), a, b};
}
// Qué hay libre en ese rango: lo reservado en shows que se solapan, más lo que está físicamente fuera sin devolver, cuenta como ocupado
function availCompute(){
  const P = availRange(), busy = new Map();
  S.reservations.forEach(r => {
    if (r.state === 'returned') return; const q = projById(r.project_id); if (!q || q.status === 'cancelled') return;
    const ov = new Date(q.starts_at) < P.b && new Date(q.ends_at) > P.a;
    if (ov || r.state === 'out'){ if (!busy.has(r.unit_id)) busy.set(r.unit_id, []); busy.get(r.unit_id).push({p:q, out:r.state === 'out'}); }
  });
  const bulkBusy = {};
  S.bulkRes.forEach(b => {
    if (b.state === 'returned') return; const q = projById(b.project_id); if (!q || q.status === 'cancelled') return;
    const ov = new Date(q.starts_at) < P.b && new Date(q.ends_at) > P.a;
    if (ov || b.state === 'out') (bulkBusy[b.model_id] = bulkBusy[b.model_id] || []).push({p:q, qty:b.qty, out:b.state === 'out'});
  });
  return S.models.map(m => {
    if (m.is_bulk){
      const ls = bulkBusy[m.id] || [], used = ls.reduce((s, x) => s + x.qty, 0), rep = bulkRepair(m), total = m.bulk_stock || 0;
      return {m, total, free:Math.max(0, total - rep - used), busy:used, repair:rep, incomplete:0, shows:[...new Set(ls.map(x => x.p.name))], bulkLines:ls, units:[]};
    }
    const all = S.units.filter(u => u.model_id === m.id && u.status !== 'lost' && u.status !== 'retired');
    const free = all.filter(u => u.status === 'ok' && !busy.has(u.id)), busyU = all.filter(u => u.status === 'ok' && busy.has(u.id)), broken = all.filter(u => u.status === 'repair');
    return {m, total:all.length, free:free.length, busy:busyU.length, repair:broken.length, incomplete:free.filter(u => u.missing_note).length,
      shows:[...new Set(busyU.flatMap(u => busy.get(u.id).map(x => x.p.name)))], units:{free, busyU, broken, busy}, bulkLines:[]};
  }).filter(r => r.total > 0);
}

// Guarda la foto en la papelera y luego borra. Si todavía no existe la papelera (falta esquema_v12.sql), borra igual y lo dice.
async function trashRun(kind, id, label, del){
  let tid = null;
  try {
    const snap = await trashCollect(kind, id), r = await sb.from('trash').insert({kind, label, data:snap}).select().single();
    if (r.error) throw r.error; if (!r.data || !r.data.id) throw new Error('La papelera no respondió: no se ha borrado nada'); tid = r.data.id;
  } catch (e){ if (!isSchemaErr(e)){ toast(errMsg(e), true, true); try { e.__toasted = true; } catch (x) {} throw e; } }
  await del();
  return tid;
}
let undoTimer;
function undoBar(msg, tid){
  if (!tid) return toast(msg + ' (sin papelera: falta esquema_v12.sql)');
  let u = $('#undobar'); if (!u){ u = document.createElement('div'); u.id = 'undobar'; u.className = 'undobar'; document.body.appendChild(u); }
  u.innerHTML = `<span>${esc(msg)}</span><button onclick="undoNow('${tid}')">Deshacer</button>`; u.hidden = false;

async function undoNow(tid){ const u = $('#undobar'); if (u) u.hidden = true; await restoreTrash(tid); }
async function restoreTrash(tid){
  const r = await sb.from('trash').select('*').eq('id', tid).limit(1);
  if (r.error || !(r.data || []).length) return toast(r.error ? errMsg(r.error) : 'Ya no está en la papelera', true, true);
  const row = r.data[0], d = row.data || {}; let problems = 0, lastErr = null;
  for (const {t, rows} of (d.tables || [])) for (let i = 0; i < rows.length; i += 400){
    const res = await sb.from(t).upsert(rows.slice(i, i + 400)); if (res.error){ problems++; lastErr = res.error; }
  }
  for (const l of (d.links || [])){ const res = await sb.from(l.t).update({[l.col]:l.val}).in('id', l.ids); if (res.error){ problems++; lastErr = res.error; } }
  if (problems){ await loadAll(); return toast(`Se restauró solo una parte: ${errMsg(lastErr)} Sigue en la papelera por si quieres volver a intentarlo.`, true, true); }
  await sb.from('trash').delete().eq('id', tid);
  await loadAll(); if (S.view && S.view.name === 'trash'){ await loadTrash(); render(); }
  toast(`«${row.label}» restaurado`);
}

const nfcSupported = () => 'NDEFReader' in window;
const nfcCode = txt => { const m = /[UK]-[0-9A-F]{8}/i.exec(String(txt || '')); return m ? m[0].toUpperCase() : null; };
async function nfcToggle(){
  if (S.nfc){ S.nfc.ctl.abort(); S.nfc = null; const b = $('#nfc-btn'); if (b) b.textContent = 'Leer pegatina NFC'; return toast('NFC parado'); }
  try {
    const reader = new NDEFReader(), ctl = new AbortController();
    await reader.scan({signal:ctl.signal});
    S.nfc = {reader, ctl}; const b = $('#nfc-btn'); if (b) b.textContent = 'Leyendo NFC… (toca para parar)';
    reader.onreading = ev => {
      let code = null;
      for (const rec of ev.message.records){ try { code = nfcCode(new TextDecoder(rec.encoding || 'utf-8').decode(rec.data)); } catch (e) {} if (code) break; }
      if (code) handleCode(code).catch(() => {}); else scanMsg('Esa pegatina NFC no lleva un código de RentApp.', 'warn');
    };
    reader.onreadingerror = () => scanMsg('No se pudo leer la pegatina NFC. Acércala otra vez.', 'warn');
    toast('Acerca la pegatina NFC al móvil');
  } catch (e) { S.nfc = null; toast(e && e.name === 'NotAllowedError' ? 'Activa el permiso de NFC para esta página' : 'No se pudo activar el NFC en este móvil', true); }
}
async function nfcWrite(code){

function kitListHtml(kt, lay){
  const L = kitContentLines(kt), Wd = lay === 'full' ? 58.9 : 34, Ht = lay === 'full' ? 22 : 15, tfs = lay === 'full' ? 8.5 : 6.5;
  const avail = Ht - tfs * 1.15 * 0.3528 - 0.8, long = Math.max(0, ...L.map(x => x.length));
  let pick = null, shown = L.length ? L : ['Sin contenido definido'];
  outer: for (const fs of [8, 7.5, 7, 6.5, 6, 5.5, 5, 4.5]) for (const cols of [1, 2, 3]){
    const lh = fs * 1.2 * 0.3528, rows = Math.floor(avail / lh), cw = (Wd - (cols - 1) * 1.5) / cols, ch = Math.floor(cw / (fs * 0.52 * 0.3528));
    if (rows >= 1 && rows * cols >= shown.length && long <= ch){ pick = {fs, cols, rows, lh}; break outer; }
  }
  if (!pick){
    const fs = 4.5, cols = 3, lh = fs * 1.2 * 0.3528, rows = Math.max(1, Math.floor(avail / lh)); pick = {fs, cols, rows, lh};
    if (shown.length > rows * cols) shown = shown.slice(0, rows * cols - 1).concat('… y ' + (shown.length - rows * cols + 1) + ' más');
  }
  return `<b>${esc(kt.name)}</b><div class="klist" style="font-size:${pick.fs}pt;column-count:${pick.cols};column-gap:1.5mm;height:${(pick.rows * pick.lh).toFixed(2)}mm">${shown.map(x => `<div class="kl">${esc(x)}</div>`).join('')}</div>`;
}

const DUR_DEFAULT = [{days:1, factor:1}, {days:2, factor:1.5}, {days:3, factor:2}, {days:7, factor:3.5}, {days:14, factor:5.5}, {days:30, factor:9}];
const appCfg = () => (S.settings && S.settings.app_config) || {};
function durCfg(){
  const c = appCfg(), t = (Array.isArray(c.durTable) && c.durTable.length ? c.durTable : DUR_DEFAULT).map(x => ({days:Number(x.days), factor:Number(x.factor)})).filter(x => x.days >= 1 && x.factor > 0).sort((a, b) => a.days - b.days);
  return {enabled:!!c.durEnabled, table:t.length ? t : DUR_DEFAULT};
}
function durFactor(days, table){
  const t = table || durCfg().table; days = Math.max(1, Number(days) || 1);
  if (days <= t[0].days) return Math.round(t[0].factor * days / t[0].days * 100) / 100;
  for (let i = 1; i < t.length; i++) if (days <= t[i].days){ const a = t[i - 1], b = t[i]; return Math.round((a.factor + (b.factor - a.factor) * (days - a.days) / (b.days - a.days)) * 100) / 100; }
  const a = t[t.length - 2] || {days:0, factor:0}, b = t[t.length - 1], slope = t.length > 1 ? (b.factor - a.factor) / (b.days - a.days) : b.factor / b.days;
  return Math.round((b.factor + slope * (days - b.days)) * 100) / 100;
}

function confirmChecks(pid){

    if (u.status !== 'ok') out.push({lvl:'bad', text:`${unitLabel(u)} está ${UNIT_STATUS[u.status].toLowerCase()}.`});

    const pg = 3 + 3 * i, ct = pg + 1, im = pg + 2, content = `q ${ptW.toFixed(3)} 0 0 ${ptH.toFixed(3)} 0 0 cm /Im0 Do Q`;
    offs[pg] = len; push(`${pg} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW.toFixed(3)} ${ptH.toFixed(3)}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
    offs[ct] = len; push(`${ct} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);

function searchAll(q){
  const k = norm(q), hit = (...a) => a.some(x => x != null && norm(String(x)).includes(k)), out = [], F = (t, id) => isFav(t, id) ? 0 : 1;
  const add = (g, arr) => { if (arr.length) out.push({g, items:arr.sort((a, b) => a.f - b.f).slice(0, 8)}); };
  add('Modelos', S.models.filter(m => hit(m.name, m.brand, (m.tags || []).join(' '), m.owner, m.notes)).map(m => ({t:'model', id:m.id, title:m.name, sub:[m.brand, m.is_bulk ? 'Por cantidad' : (S.units.filter(u => u.model_id === m.id).length + ' equipos')].filter(Boolean).join(' · '), f:F('model', m.id)})));
  add('Equipos', S.units.filter(u => hit(u.serial_number, u.manufacturer_serial, u.code)).map(u => ({t:'unit', id:u.id, title:unitLabel(u), sub:[u.manufacturer_serial ? 'Fabricante ' + u.manufacturer_serial : '', UNIT_STATUS[u.status]].filter(Boolean).join(' · '), f:1})));
  add('Kits', S.kits.filter(x => hit(x.name, x.code)).map(x => ({t:'kit', id:x.id, title:x.name, sub:x.code, f:F('kit', x.id)})));
  add(W.S[0].toUpperCase() + W.S.slice(1) + 's', S.projects.filter(p => hit(p.name, p.client, p.venue)).sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).map(p => ({t:'project', id:p.id, title:p.name, sub:[fmtD(p.starts_at), p.client, PROJ_STATUS[p.status]].filter(Boolean).join(' · '), f:F('project', p.id)})));
  add('Clientes', S.clients.filter(c => hit(c.name, c.tax_id, c.email, c.phone, c.contact_name)).map(c => ({t:'client', id:c.id, title:c.name, sub:[c.tax_id, c.email].filter(Boolean).join(' · '), f:F('client', c.id)})));
  add('Técnicos', S.techs.filter(t => hit(t.name, t.phone, t.email)).map(t => ({t:'tech', id:t.id, title:t.name, sub:[t.phone, t.email].filter(Boolean).join(' · '), f:1})));
  add('Notas', S.notes.filter(n => !n.done && hit(n.text)).map(n => ({t:'note', id:n.id, title:n.text, sub:noteDueTxt(n), f:1})));
  return out;
}

const icsStamp = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
const icsEsc = s => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line){
  const enc = new TextEncoder(), out = []; let cur = '', n = 0;
  for (const ch of line){ const b = enc.encode(ch).length; if (n + b > (out.length ? 74 : 75)){ out.push(cur); cur = ''; n = 0; } cur += ch; n += b; }
  out.push(cur); return out.join('\r\n ');
}
function icsVevent(p, status){
  const crew = S.assigns.filter(a => a.project_id === p.id).map(a => { const t = techById(a.technician_id); return t ? t.name + (a.role ? ' (' + a.role + ')' : '') : ''; }).filter(Boolean);
  const desc = [p.client ? 'Cliente: ' + p.client : '', crew.length ? 'Equipo: ' + crew.join(', ') : '', p.notes || ''].filter(Boolean).join('\n');
  const l = ['BEGIN:VEVENT', `UID:${p.id}@rentapp`, 'DTSTAMP:' + icsStamp(Date.now()), 'DTSTART:' + icsStamp(p.starts_at), 'DTEND:' + icsStamp(p.ends_at), 'SUMMARY:' + icsEsc(p.name), 'STATUS:' + status];
  if (p.venue) l.push('LOCATION:' + icsEsc(p.venue)); if (desc) l.push('DESCRIPTION:' + icsEsc(desc));

function mrSplit(free, p){
  const out = [];
  for (const f of free){
    if (p.x >= f.x + f.w - 1e-9 || p.x + p.w <= f.x + 1e-9 || p.y >= f.y + f.d - 1e-9 || p.y + p.d <= f.y + 1e-9){ out.push(f); continue; }
    if (p.x > f.x) out.push({x:f.x, y:f.y, w:p.x - f.x, d:f.d});
    if (p.x + p.w < f.x + f.w) out.push({x:p.x + p.w, y:f.y, w:f.x + f.w - p.x - p.w, d:f.d});
    if (p.y > f.y) out.push({x:f.x, y:f.y, w:f.w, d:p.y - f.y});
    if (p.y + p.d < f.y + f.d) out.push({x:f.x, y:p.y + p.d, w:f.w, d:f.y + f.d - p.y - p.d});
  }
  const eq = (a, b) => a.x === b.x && a.y === b.y && a.w === b.w && a.d === b.d, inn = (a, b) => a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.d <= b.y + b.d;

    const rows = [...d.querySelectorAll('.dn-row')], inc = rows.filter(r => r.querySelector('[data-in]').checked), bad = inc.filter(r => r.querySelector('[data-st]').value !== 'ok');
    d.querySelector('.dn-sum').textContent = `${inc.length}/${rows.length}${bad.length ? ' · ' + plu(bad.length, 'incidencia', 'incidencias') : ''}`;
  });
}
function dnAllOk(){ document.querySelectorAll('#dn-items [data-st]').forEach(s => s.value = 'ok'); document.querySelectorAll('#dn-items [data-in]').forEach(c => c.checked = true); dnUpd(); }
function dnCollect(){
  return DN.items.map((it, i) => { const r = document.querySelector(`#dn-items .dn-row[data-i="${i}"]`); if (!r) return it;
    const q = r.querySelector('[data-q]');
    return Object.assign({}, it, {inc:r.querySelector('[data-in]').checked, st:r.querySelector('[data-st]').value, note:r.querySelector('[data-n]').value.trim(), qty:q ? Math.max(0, parseInt(q.value) || 0) : it.qty}); });
}
async function dnAddPhotos(input){
  for (const f of [...input.files]){
    if (DN.photos.length >= 12){ toast('Como máximo 12 fotos por albarán', true); break; }
    try { const blob = await resizeImage(f, 1400, 'image/jpeg', 0.72); DN.photos.push({blob, obj:URL.createObjectURL(blob), cap:''}); } catch (e) { toast('No se pudo leer esa foto', true); }
  }
  input.value = ''; dnPhotosRender();
}
function dnPhotosRender(){
  const b = $('#dn-photos'); if (!b) return; $('#dn-pc').textContent = DN.photos.length;
  b.innerHTML = DN.photos.map((p, i) => `<div class="dn-ph"><img src="${esc(p.url || p.obj)}" alt="Foto ${i + 1} del estado del material"><input value="${esc(p.cap)}" placeholder="Pie de foto (opcional)" aria-label="Pie de la foto ${i + 1}" onchange="DN.photos[${i}].cap=this.value"><button class="btn small" aria-label="Quitar la foto ${i + 1}" onclick="dnDelPhoto(${i})">✕</button></div>`).join('');
  a11yFix(b);
}
function dnDelPhoto(i){ DN.photos.splice(i, 1); dnPhotosRender(); }
function dnSigInit(){
  const c = $('#dn-sig'); if (!c) return; const x = c.getContext('2d'); x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#111';
  let down = false, last = null;
  const pos = e => { const r = c.getBoundingClientRect(); return {x:(e.clientX - r.left) * c.width / r.width, y:(e.clientY - r.top) * c.height / r.height}; };
  c.onpointerdown = e => { e.preventDefault(); down = true; last = pos(e); try { c.setPointerCapture(e.pointerId); } catch (x2) {} x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(last.x + 0.1, last.y + 0.1); x.stroke(); DN.sigDirty = true; };
  c.onpointermove = e => { if (!down) return; const p = pos(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
}
function dnSigClear(){ const c = $('#dn-sig'); c.getContext('2d').clearRect(0, 0, c.width, c.height); DN.sigDirty = false; }
const dnNumber = off => { const pre = `ALB-${new Date().getFullYear()}-`; const n = (S.dnotes || []).filter(x => (x.number || '').startsWith(pre)).map(x => parseInt(x.number.slice(pre.length)) || 0); return pre + String((n.length ? Math.max(...n) : 0) + 1 + (off || 0)).padStart(4, '0'); };
async function saveDeliveryNote(sign){
  const items = dnCollect(), name = $('#dn-name').value.trim();
  if (!items.some(x => x.inc)) return toast('Deja marcado al menos un elemento del material', true);
  if (sign){
    if (!name){ $('#dn-name').focus(); return toast('Escribe el nombre de quien firma', true); }
    if (!DN.sigDirty) return toast('Falta la firma: dibújala con el dedo en el recuadro', true);
  }
  const id = DN.id || uuid4(), photos = []; let n = 0;
  if (DN.photos.some(x => x.blob)) toast('Subiendo fotos…');
  for (const ph of DN.photos){
    if (ph.url){ photos.push({url:ph.url, cap:ph.cap || ''}); continue; }
    const path = `albaranes/${id}/${Date.now()}-${n++}.jpg`, r = await sb.storage.from('fotos').upload(path, ph.blob, {contentType:'image/jpeg', upsert:true});
    if (r.error){ toast('No se pudo subir una foto: ' + r.error.message + ' (¿ejecutaste esquema_v3.sql?)', true); throw r.error; }
    photos.push({url:sb.storage.from('fotos').getPublicUrl(path).data.publicUrl, cap:ph.cap || ''});
  }
  const row = {project_id:DN.pid, kind:DN.kind, when_at:$('#dn-when').value ? new Date($('#dn-when').value).toISOString() : new Date().toISOString(), signer_name:name || null, signer_id:$('#dn-nif').value.trim() || null,
    notes:$('#dn-notes').value.trim() || null, items, photos, signature:sign ? $('#dn-sig').toDataURL('image/png') : null, signed_at:sign ? new Date().toISOString() : null};
  let number = null;
  if (DN.id){ await db(sb.from('delivery_notes').update(row).eq('id', id)); const old = (S.dnotes || []).find(x => x.id === id); number = old && old.number; }
  else {
    row.id = id;
    for (let t = 0; t < 4; t++){ row.number = dnNumber(t); try { await db(sb.from('delivery_notes').insert(row)); break; } catch (e) { if (!(e && e.code === '23505') || t === 3) throw e; } }
    number = row.number;
  }
  const dmg = items.filter(x => x.inc && x.t === 'u' && x.st === 'dmg' && (unitById(x.id) || {}).status === 'ok');
  if (sign && DN.kind === 'pickup' && dmg.length && confirm(`Has marcado ${plu(dmg.length, 'equipo', 'equipos')} como dañado${dmg.length === 1 ? '' : 's'}. ¿Lo${dmg.length === 1 ? '' : 's'} paso a «En reparación» con lo que has anotado?`)){
    for (const x of dmg){
      await db(sb.from('units').update({status:'repair'}).eq('id', x.id));
      await db(sb.from('maintenance_logs').insert({unit_id:x.id, kind:'repair', done_on:todayStr(), description:x.note || `Dañado en la recogida (${number})`}));
    }
  }
  const pid = DN.pid, kind = DN.kind; closeModal(); await loadAll();
  toast(sign ? 'Albarán firmado y guardado' : 'Albarán guardado sin firma');
  if (sign) await openDeliveryNote(pid, kind, id);
}
function dnView(n){
  const items = n.items || [], inc = items.filter(x => x.inc !== false), bad = inc.filter(x => x.st && x.st !== 'ok'), out = items.filter(x => x.inc === false);
  openModal(`<h2>Albarán de ${DN_KIND[n.kind]}</h2><div class="sub">${esc(n.number || '')} · ${esc(fmtFull(n.when_at || n.created_at))}</div>
    <div class="info"><b>${esc((projById(n.project_id) || {}).name || '')}</b><div class="sub">${plu(inc.length, 'elemento', 'elementos')}${bad.length ? ` · <b style="color:var(--warn)">${plu(bad.length, 'con incidencia', 'con incidencias')}</b>` : ' · todo bien'}${out.length ? ` · ${out.length} no incluidos` : ''}</div></div>
    ${bad.length ? `<div class="list">${bad.map(x => `<div class="row"><div class="grow"><b>${esc(x.name)}</b> ${x.sn ? `<span class="sub">${esc(x.sn)}</span>` : ''}<div class="sub">${esc(DN_ST[x.st] || '')}${x.note ? ': ' + esc(x.note) : ''}</div></div></div>`).join('')}</div>` : ''}
    ${(n.photos || []).length ? `<div class="group">Fotos (${n.photos.length})</div><div class="dn-photos">${n.photos.map((p, i) => `<div class="dn-ph"><img src="${esc(safeUrl(p.url))}" alt="Foto ${i + 1} del estado del material" onclick="openPhoto('${esc(safeUrl(p.url))}')">${p.cap ? `<div class="sub">${esc(p.cap)}</div>` : ''}</div>`).join('')}</div>` : ''}
    ${n.notes ? `<div class="info">${esc(n.notes)}</div>` : ''}
    <div class="group">Firma</div><div class="info" style="text-align:center">${n.signature ? `<img src="${esc(safeUrl(n.signature))}" alt="Firma de ${esc(n.signer_name || '')}" style="max-width:100%;max-height:110px;background:#fff;border-radius:8px">` : ''}<div><b>${esc(n.signer_name || '')}</b>${n.signer_id ? ' · ' + esc(n.signer_id) : ''}</div><div class="sub">Firmado el ${esc(fmtFull(n.signed_at))}</div></div>
    <button class="btn primary block" style="margin-top:12px" onclick="dnPrint('${n.id}')">Imprimir / guardar en PDF</button>
    <button class="btn danger block" style="margin-top:8px" onclick="deleteDeliveryNote('${n.id}')">Eliminar este albarán</button>`);
}
async function dnPrint(id){
  const r = await sb.from('delivery_notes').select('*').eq('id', id); if (r.error) return toast(errMsg(r.error), true, true);
  const n = (r.data || [])[0]; if (!n) return; closeModal(); printDoc('doc', deliveryDocHtml(n));
}
function deliveryDocHtml(n){
  const p = projById(n.project_id) || {name:'', venue:''}, items = n.items || [], inc = items.filter(x => x.inc !== false), out = items.filter(x => x.inc === false);
  const groups = new Map(); inc.forEach(x => { const k = x.kit || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  const rows = [...groups.entries()].map(([k, xs]) => (k ? `<tr class="kit"><td colspan="5"><b>Kit ${esc(k)}</b></td></tr>` : '') + xs.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.sn || '')}</td><td style="text-align:right">${x.qty}</td><td>${esc(DN_ST[x.st] || 'Bien')}</td><td>${esc(x.note || '')}</td></tr>`).join('')).join('');
  const t = DN_KIND[n.kind] || '';
  return `${bizHeader()}<h1>Albarán de ${t}</h1>
    <p>Nº <b>${esc(n.number || '')}</b> · ${esc(fmtFull(n.when_at || n.created_at))}</p>
    <p>${esc(W.S)}: <b>${esc(p.name)}</b>${p.venue ? ' · ' + esc(p.venue) : ''}</p>${clientBlock(p)}
    <table class="dn-t"><thead><tr><th>Material</th><th>Nº de serie / código</th><th style="text-align:right">Cant.</th><th>Estado</th><th>Observación</th></tr></thead><tbody>${rows}</tbody></table>
    ${out.length ? `<p class="small" style="margin-top:3mm"><b>No incluidos en este albarán:</b> ${out.map(x => esc(x.name + (x.sn ? ' ' + x.sn : ''))).join(', ')}</p>` : ''}
    ${n.notes ? `<p style="margin-top:3mm"><b>Observaciones:</b> ${esc(n.notes)}</p>` : ''}
    ${(n.photos || []).length ? `<h2 style="margin-top:5mm">Fotos del estado</h2><div class="dn-pg">${n.photos.map((ph, i) => `<figure><img src="${esc(safeUrl(ph.url))}" alt="Foto ${i + 1}"><figcaption class="small">${esc(ph.cap || 'Foto ' + (i + 1))}</figcaption></figure>`).join('')}</div>` : ''}
    <p style="margin-top:6mm">Con su firma, quien ${n.kind === 'delivery' ? 'recibe' : 'devuelve'} el material confirma que la lista, las cantidades y el estado indicados en este albarán son correctos.</p>
    <div class="dn-sign">${n.signature ? `<img src="${esc(safeUrl(n.signature))}" alt="Firma">` : '<div style="height:22mm"></div>'}<div><b>${esc(n.signer_name || '')}</b>${n.signer_id ? ' · ' + esc(n.signer_id) : ''}</div><div class="small">${n.signed_at ? 'Firmado el ' + esc(fmtFull(n.signed_at)) + ' (firma dibujada en pantalla)' : 'Pendiente de firma'}</div></div>`;
}
async function deleteDeliveryNote(id){
  if (!confirm('Se borrará este albarán con su firma y sus fotos. ¿Seguro?')) return;
  const r = await sb.from('delivery_notes').select('photos').eq('id', id); const ph = ((r.data || [])[0] || {}).photos || [];
  await db(sb.from('delivery_notes').delete().eq('id', id)); ph.forEach(x => removeOldPhoto(x.url));
  closeModal(); await loadAll(); toast('Albarán eliminado');
}
/* ============ Arranque ============ */
S.queue = lsGet(QUEUE_KEY, []); S.failed = lsGet(FAIL_KEY, []);
sb.auth.onAuthStateChange((_e, session) => {
  // Sin conexión no se puede renovar la sesión: si ya habías entrado, se sigue con los datos guardados
  if (!session && !navigator.onLine && lsGet(WAS_KEY, false) && lsGet(SNAP_KEY, null)) session = {offline:true};
  if (session && !session.offline) lsSet(WAS_KEY, true);
  const was = !!S.session; S.session = session;
  if (session && !was) setTimeout(() => loadAll(), 0); else render();
});
window.addEventListener('online', async () => {
  updateOffBar();
  if (S.session && S.session.offline){ const r = await sb.auth.getSession(); if (r.data && r.data.session) S.session = r.data.session; }
  await flushQueue(); await loadAll(false); if (S.tab !== 'scan') render();
});
window.addEventListener('offline', updateOffBar);
setInterval(() => { if (S.queue.length && navigator.onLine) flushQueue(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
