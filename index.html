function updateOffBar(){
  const el = $('#offbar'); if (!el) return;
  const n = S.queue.length, off = !navigator.onLine, f = S.failed.length;
  if (!off && !n && !f){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = off ? `Sin conexión${n ? ` · ${n} pendiente${n===1?'':'s'} de enviar` : ''}` : n ? `Enviando ${n} pendiente${n===1?'':'s'}…` : `${f} escaneo${f===1?'':'s'} sin registrar`;
}
function localCond(uid, cond, note, clear){
  const u = unitById(uid); if (!u) return;
  if (cond === 'repair') u.status = 'repair';
  else if (cond === 'incomplete') u.missing_note = note || 'Incompleto';
  else if (clear) u.missing_note = null;
}
// Refleja la operación en los datos del móvil al instante
function applyLocal(op){
  if (op.t === 'out'){ const r = S.reservations.find(x => x.unit_id === op.unit_id && x.project_id === op.project_id && x.state !== 'returned'); if (r) r.state = 'out'; }
  else if (op.t === 'in'){ const r = S.reservations.find(x => x.unit_id === op.unit_id && x.state === 'out'); if (r) r.state = 'returned'; localCond(op.unit_id, op.cond, op.note, op.clear); }
  else if (op.t === 'kout'){
    S.reservations.filter(x => x.project_id === op.project_id && x.kit_id === op.kit_id && x.state === 'planned').forEach(x => x.state = 'out');
    S.bulkRes.filter(x => x.project_id === op.project_id && x.kit_id === op.kit_id && x.state === 'planned').forEach(x => x.state = 'out');
  } else if (op.t === 'kin'){
    S.reservations.filter(x => x.kit_id === op.kit_id && x.state === 'out').forEach(x => x.state = 'returned');
    S.bulkRes.filter(x => x.kit_id === op.kit_id && x.state === 'out').forEach(x => x.state = 'returned');
    (op.items || []).forEach(i => localCond(i.unit_id, i.cond, i.note, i.clear));
  }
}
const must = r => { if (r.error) throw r.error; return r.data; };
async function syncCondition(unitId, cond, note, clear, at){
  if (cond === 'repair'){
    must(await sb.from('units').update({status:'repair'}).eq('id', unitId));
    must(await sb.from('maintenance_logs').insert({unit_id:unitId, kind:'repair', done_on:at.slice(0, 10), description:note || 'Devuelta con daños'}));
  } else if (cond === 'incomplete'){
    must(await sb.from('units').update({missing_note:note || 'Incompleto'}).eq('id', unitId));
    must(await sb.from('maintenance_logs').insert({unit_id:unitId, kind:'missing', done_on:at.slice(0, 10), description:note || 'Devuelta incompleta'}));
  } else if (clear){
    must(await sb.from('units').update({missing_note:null}).eq('id', unitId));
  }
}
// Envía una operación al servidor
async function syncOp(op){
  if (op.t === 'out'){
    const rs = must(await sb.from('reservations').select('id,state').eq('unit_id', op.unit_id).eq('project_id', op.project_id).neq('state', 'returned').limit(1));
    if (!rs.length) throw {message:'la unidad ya no estaba reservada en ese show'};
    if (rs[0].state === 'planned') must(await sb.from('reservations').update({state:'out'}).eq('id', rs[0].id));
    must(await sb.from('scan_events').insert({unit_id:op.unit_id, project_id:op.project_id, action:'out', at:op.at}));
  } else if (op.t === 'in'){
    const rs = must(await sb.from('reservations').select('id,project_id').eq('unit_id', op.unit_id).eq('state', 'out').limit(1));
    if (rs.length){
      must(await sb.from('reservations').update({state:'returned'}).eq('id', rs[0].id));
      must(await sb.from('scan_events').insert({unit_id:op.unit_id, project_id:rs[0].project_id, action:'in', at:op.at, condition:op.cond, note:op.note || null}));
    }
    await syncCondition(op.unit_id, op.cond, op.note, op.clear, op.at);
  } else if (op.t === 'kout'){
    const rs = must(await sb.from('reservations').select('id,unit_id').eq('project_id', op.project_id).eq('kit_id', op.kit_id).eq('state', 'planned'));
    if (rs.length){
      must(await sb.from('reservations').update({state:'out'}).eq('project_id', op.project_id).eq('kit_id', op.kit_id).eq('state', 'planned'));
      must(await sb.from('scan_events').insert(rs.map(r => ({unit_id:r.unit_id, project_id:op.project_id, action:'out', at:op.at}))));
    }
    must(await sb.from('bulk_reservations').update({state:'out'}).eq('project_id', op.project_id).eq('kit_id', op.kit_id).eq('state', 'planned'));
  } else if (op.t === 'kin'){
    const rs = must(await sb.from('reservations').select('id,unit_id,project_id').eq('kit_id', op.kit_id).eq('state', 'out'));
    if (rs.length){
      must(await sb.from('reservations').update({state:'returned'}).eq('kit_id', op.kit_id).eq('state', 'out'));
      const by = {}; (op.items || []).forEach(i => by[i.unit_id] = i);
      must(await sb.from('scan_events').insert(rs.map(r => { const i = by[r.unit_id] || {}; return {unit_id:r.unit_id, project_id:r.project_id, action:'in', at:op.at, condition:i.cond || 'ok', note:i.note || null}; })));
    }
    must(await sb.from('bulk_reservations').update({state:'returned'}).eq('kit_id', op.kit_id).eq('state', 'out'));
    for (const i of (op.items || [])) await syncCondition(i.unit_id, i.cond, i.note, i.clear, op.at);
  }
}
function enqueue(op){
  op.at = new Date().toISOString();
  S.queue.push(op); lsSet(QUEUE_KEY, S.queue);
  applyLocal(op); saveSnapshot(); updateOffBar();
  flushQueue();
}
let flushing = false;
async function flushQueue(){
  if (flushing || !S.queue.length || !navigator.onLine || !S.session) return;
  flushing = true; let synced = 0, failedNow = 0;
  try {
    while (S.queue.length){
      const op = S.queue[0];
      try { await syncOp(op); S.queue.shift(); synced++; }
      catch(e){
        if (isNetErr(e)) break;
        S.queue.shift(); S.failed.push({op, error:errMsg(e), at:new Date().toISOString()}); failedNow++;
      }
      lsSet(QUEUE_KEY, S.queue); lsSet(FAIL_KEY, S.failed);
    }
  } finally { flushing = false; lsSet(QUEUE_KEY, S.queue); lsSet(FAIL_KEY, S.failed); }
  updateOffBar();
  if (synced || failedNow){
    await loadAll(false);
    if (S.tab === 'scan') updateProgress(); else render();
  }
  if (failedNow) toast(`${failedNow} escaneo${failedNow===1?'':'s'} no se pudo registrar. Mira Más > Pendientes.`, true);
}

// Peso, volumen y potencia de todo lo reservado en un show
function loadStats(p){
  const rs = S.reservations.filter(r => r.project_id === p.id), bs = S.bulkRes.filter(b => b.project_id === p.id);
  let kg = 0, m3 = 0, w = 0; const noW = new Set(), noP = new Set();
  const add = (m, qty) => {
    if (!m) return;
    if (m.weight_kg == null) noW.add(m.name); else kg += Number(m.weight_kg) * qty;
    m3 += vol(m) * qty;
    if (m.power_w == null) noP.add(m.name); else w += Number(m.power_w) * qty;
  };
  rs.forEach(r => { const u = unitById(r.unit_id); if (u) add(modelById(u.model_id), 1); });
  bs.forEach(b => add(modelById(b.model_id), b.qty));
  [...new Set([...rs, ...bs].map(x => x.kit_id).filter(Boolean))].forEach(kid => {
    const k = kitById(kid); if (!k) return;
    const kv = vol(k);
    if (kv > 0){   // si el case tiene medidas, ocupa su volumen en vez del suelto
      let cv = 0;
      rs.filter(r => r.kit_id === kid).forEach(r => { const u = unitById(r.unit_id); if (u) cv += vol(modelById(u.model_id)); });
      bs.filter(b => b.kit_id === kid).forEach(b => cv += vol(modelById(b.model_id)) * b.qty);
      m3 += kv - cv;
    }
    kg += Number(k.weight_kg) || 0;
  });
  return {kg, m3, w, noW:[...noW], noP:[...noP]};
}
function loadCard(p){
  if (!pieces(p)) return '';
  const s = loadStats(p), st = S.settings || {}, vanV = Number(st.van_volume_m3) || 0, vanW = Number(st.van_payload_kg) || 0;

    <div class="sub ${v > max ? 'bad' : ''}">${Math.round(100 * v / max)}% ${what} (${fmtNum(max)})${v > max ? ' · NO CABE' : ''}</div>` : '';
  const amps = s.w / 230, lines = Math.ceil(amps / 12.8);
  const miss = (arr, what) => arr.length ? `<div class="sub" style="margin-top:4px">Sin ${what}: ${esc(arr.slice(0, 5).join(', '))}${arr.length > 5 ? ` y ${arr.length - 5} más` : ''}.</div>` : '';
  return `<div class="info"><b>Carga y potencia</b>
    <div style="margin-top:6px">Peso <b>${fmtNum(s.kg)} kg</b> · Volumen <b>${fmtNum(s.m3, 2)} m³</b></div>
    ${bar(s.kg, vanW, 'de la carga máxima en kg')}${bar(s.m3, vanV, 'del volumen útil en m³')}
    ${vanV || vanW ? '<div class="sub" style="margin-top:4px">El volumen es la suma de las medidas, sin contar huecos al cargar.</div>' : ''}
    <div style="margin-top:8px">Potencia <b>${fmtNum(s.w / 1000, 2)} kW</b> · ${fmtNum(amps)} A a 230 V · unas ${lines} línea${lines === 1 ? '' : 's'} de 16 A</div>
    <div class="sub">Orientativo, a máxima potencia y sin simultaneidad.</div>
    ${miss(s.noW, 'peso')}${miss(s.noP, 'potencia')}</div>`;
}

function clientSelect(p){
  const legacy = p.client && !(p.client_id && clientById(p.client_id)) && !S.clients.find(c => norm(c.name) === norm(p.client));
  const sel = (p.client_id && clientById(p.client_id)) ? p.client_id : (S.clients.find(c => norm(c.name) === norm(p.client)) || {}).id || (legacy ? '__legacy' : '');
  return `<select id="p-client" onchange="clientChanged()" data-legacy="${esc(p.client || '')}"><option value="">Sin cliente</option>
    ${S.clients.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
    ${legacy ? `<option value="__legacy" ${sel === '__legacy' ? 'selected' : ''}>${esc(p.client)} (sin ficha)</option>` : ''}
    <option value="__new">+ Nuevo cliente…</option></select>`;
}
function clientChanged(){ const nw = $('#p-client').value === '__new', el = $('#p-newclient'); el.hidden = !nw; if (nw) el.focus(); }
// Devuelve {id, name} del cliente elegido en el formulario del show (creándolo si es nuevo), o false si falta algo
async function resolveClient(){
  const sel = $('#p-client').value;
  if (sel === '__new'){
    const n = $('#p-newclient').value.trim();
    if (!n){ $('#p-newclient').focus(); toast('Escribe el nombre del nuevo cliente', true); return false; }
    const old = S.clients.find(c => norm(c.name) === norm(n));
    if (old) return {id:old.id, name:old.name};
    const row = await db(sb.from('clients').insert({name:n}).select().single());
    return {id:row.id, name:row.name};
  }
  if (sel === '__legacy') return {id:null, name:$('#p-client').dataset.legacy || null};
  if (sel){ const c = clientById(sel); return {id:c.id, name:c.name}; }
  return {id:null, name:null};
}
function clientBlock(p){
  const c = p.client_id ? clientById(p.client_id) : null;
  if (!c) return p.client ? `<p>Cliente: <b>${esc(p.client)}</b></p>` : '';
  const l = [c.tax_id ? 'NIF ' + esc(c.tax_id) : '', c.address ? esc(c.address).replace(/\n/g, ', ') : '', [c.contact_name, c.phone, c.email].filter(Boolean).map(esc).join(' · ')].filter(Boolean);
  return `<p>Cliente: <b>${esc(c.name)}</b></p>` + (l.length ? `<p class="small">${l.join(' · ')}</p>` : '');
}
const showsOf = c => S.projects.filter(p => p.client_id === c.id);
function clientsList(){
  const legacy = S.projects.filter(p => p.client && !p.client_id).length;
  return bar('Clientes', {back:true, actions:`<button class="btn primary small" onclick="openClientForm()">+ Cliente</button>`})
    + (S.clients.length ? `<div class="search"><input type="search" placeholder="Buscar cliente" oninput="filterRows(this.value)"></div>
      <div class="list">${S.clients.map(c => { const n = showsOf(c).length;
        return `<div class="row tap" data-s="${esc((c.name + ' ' + (c.contact_name || '') + ' ' + (c.email || '') + ' ' + (c.phone || '')).toLowerCase())}" onclick="openView('client','${c.id}')">
          <div class="grow"><b>${esc(c.name)}</b><div class="sub">${esc([c.contact_name, c.phone].filter(Boolean).join(' · '))}</div></div>
          <div class="sub">${n} show${n === 1 ? '' : 's'}</div></div>`; }).join('')}</div>`
      : `<div class="empty">Aún no hay clientes.<br>Pulsa «+ Cliente» para añadir el primero, o créalos al vuelo al crear un show.</div>`)
    + (legacy ? `<div class="info"><div class="sub">Tienes ${legacy} show${legacy === 1 ? '' : 's'} con el nombre del cliente escrito a mano y sin ficha.</div><div class="actions" style="margin:8px 0 0"><button class="btn" onclick="importClientsFromShows()">Crear clientes a partir de mis shows</button></div></div>` : '');
}
const phoneDigits = t => { let d = String(t || '').replace(/\D/g, ''); return d.length === 9 ? '34' + d : d; };
function clientView(id){
  const c = clientById(id);
  if (!c) return bar('Clientes', {back:true});
  const ps = showsOf(c).sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)), act = ps.filter(p => p.status !== 'cancelled');
  const sum = st => act.filter(p => (p.payment_status || 'none') === st).reduce((t, p) => t + projectTotal(p), 0);
  const tel = c.phone ? c.phone.replace(/[^\d+]/g, '') : '';
  return bar(c.name, {back:true})
    + `<div class="info">${c.contact_name ? `<div><b>${esc(c.contact_name)}</b></div>` : ''}
      ${c.phone ? `<div>${esc(c.phone)}</div>` : ''}${c.email ? `<div>${esc(c.email)}</div>` : ''}
      ${c.tax_id ? `<div class="sub">NIF / CIF: ${esc(c.tax_id)}</div>` : ''}
      ${c.address ? `<div class="sub">${esc(c.address).replace(/\n/g, '<br>')}</div>` : ''}
      ${c.notes ? `<div style="margin-top:8px">${esc(c.notes)}</div>` : ''}
      ${!(c.contact_name || c.phone || c.email || c.tax_id || c.address || c.notes) ? '<div class="sub">Sin datos de contacto todavía. Pulsa Editar para añadirlos.</div>' : ''}</div>
    <div class="actions">
      ${tel ? `<a class="btn" style="text-decoration:none" href="tel:${esc(tel)}">Llamar</a><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${phoneDigits(c.phone)}">WhatsApp</a>` : ''}
      ${c.email ? `<a class="btn" style="text-decoration:none" href="mailto:${esc(c.email)}">Email</a>` : ''}
      <button class="btn" onclick="openClientForm('${id}')">Editar</button><button class="btn danger" onclick="deleteClient('${id}')">Eliminar</button></div>
    <div class="info"><b>Cobros de este cliente</b>
      <div style="margin-top:6px">Pendiente de cobrar: <b>${eur(sum('invoiced'))}</b></div>
      <div class="sub">Aceptado sin facturar: ${eur(sum('accepted'))} · Presupuestado: ${eur(sum('quoted'))} · Cobrado: ${eur(sum('paid'))}</div></div>
    <div class="group">Shows (${ps.length})</div>
    ${ps.length ? `<div class="list">${ps.map(p => `<div class="row tap" onclick="go('shows');openView('project','${p.id}')"><div class="grow"><b>${esc(p.name)}</b><div class="sub">${esc(fmtDT(p.starts_at))}${p.venue ? ' · ' + esc(p.venue) : ''}</div></div>
      ${p.payment_status === 'invoiced' ? '<span class="badge warn">Facturado</span>' : p.payment_status === 'paid' ? '<span class="badge ok">Cobrado</span>' : ''}${p.status === 'cancelled' ? '<span class="badge bad">Cancelado</span>' : ''}</div>`).join('')}</div>`
      : `<div class="empty" style="margin:20px 24px">Este cliente aún no tiene shows. Al crear un show, elígelo en el campo Cliente.</div>`}`;
}
function openClientForm(id){
  const c = id ? clientById(id) : {};
  openModal(`<h2>${id ? 'Editar cliente' : 'Nuevo cliente'}</h2>
    <label for="c-name">Nombre o empresa</label><input id="c-name" value="${esc(c.name || '')}">
    <label for="c-contact">Persona de contacto</label><input id="c-contact" value="${esc(c.contact_name || '')}">
    <div class="two"><div><label for="c-phone">Teléfono</label><input id="c-phone" type="tel" value="${esc(c.phone || '')}"></div>
    <div><label for="c-tax">NIF / CIF</label><input id="c-tax" value="${esc(c.tax_id || '')}"></div></div>
    <label for="c-email">Email</label><input id="c-email" type="email" value="${esc(c.email || '')}">
    <label for="c-addr">Dirección</label><textarea id="c-addr" style="min-height:64px">${esc(c.address || '')}</textarea>
    <label for="c-notes">Notas</label><textarea id="c-notes">${esc(c.notes || '')}</textarea>
    <button class="btn primary block" onclick="saveClient('${id || ''}')">Guardar</button>`);
}
async function saveClient(id){
  const name = $('#c-name').value.trim(), t = i => $(i).value.trim() || null;
  if (!name) return toast('Escribe el nombre del cliente', true);
  if (S.clients.some(c => c.id !== id && norm(c.name) === norm(name))) return toast('Ya existe un cliente con ese nombre', true);
  const payload = {name, contact_name:t('#c-contact'), phone:t('#c-phone'), tax_id:t('#c-tax'), email:t('#c-email'), address:t('#c-addr'), notes:t('#c-notes')};
  if (id){
    const old = clientById(id);
    await db(sb.from('clients').update(payload).eq('id', id));
    if (old && old.name !== name) await db(sb.from('projects').update({client:name}).eq('client_id', id));   // sus shows muestran el nombre nuevo
    closeModal(); await loadAll(); toast('Guardado');
  } else {
    const row = await db(sb.from('clients').insert(payload).select().single());
    closeModal(); await loadAll(); openView('client', row.id); toast('Cliente creado');
  }
}
async function deleteClient(id){
  const c = clientById(id), n = showsOf(c).length;
  if (!confirm(`¿Eliminar a «${c.name}»?${n ? `\nSus ${n} show${n === 1 ? '' : 's'} se conservan con el nombre escrito, pero dejan de estar enlazados a la ficha.` : ''}`)) return;
  await db(sb.from('clients').delete().eq('id', id));
  S.view = {name:'clients', id:''}; await loadAll(); toast('Cliente eliminado');
}
// Convierte en fichas los nombres de cliente que ya tenías escritos a mano en los shows
async function importClientsFromShows(){
  const legacy = S.projects.filter(p => p.client && !p.client_id), groups = new Map();
  legacy.forEach(p => { const k = norm(p.client); const g = groups.get(k) || {name:p.client.trim(), ids:[]}; g.ids.push(p.id); groups.set(k, g); });
  const fresh = [...groups.entries()].filter(([k]) => !S.clients.some(c => norm(c.name) === k));
  if (!confirm(`Se van a crear ${fresh.length} cliente${fresh.length === 1 ? '' : 's'} nuevo${fresh.length === 1 ? '' : 's'} y se enlazarán ${legacy.length} show${legacy.length === 1 ? '' : 's'}. ¿Continuar?`)) return;
  const made = fresh.length ? await db(sb.from('clients').insert(fresh.map(([k, g]) => ({name:g.name}))).select()) : [];
  const byKey = {}; S.clients.concat(made).forEach(c => byKey[norm(c.name)] = c.id);
  for (const [k, g] of groups) if (byKey[k]) await db(sb.from('projects').update({client_id:byKey[k]}).in('id', g.ids));
  await loadAll(); toast('Clientes creados');
}

/* ============ LÍMITES DE CANTIDAD ============ */
// Material por cantidad que ya está metido en kits (los kits son piezas físicas: cada una solo puede estar en un kit)
const kitBulkUsed = modelId => S.kitItems.filter(i => i.model_id === modelId).reduce((s, i) => s + (i.qty || 0), 0);
const kitBulkAvail = m => Math.max(0, (m.bulk_stock || 0) - kitBulkUsed(m.id));
// Si se escribe más del máximo permitido, se queda en el máximo
function clampQty(el){
  const max = parseInt(el.max); let v = parseInt(el.value);
  if (isNaN(v)) return;
  if (v < 0) el.value = 0;
  else if (!isNaN(max) && v > max) el.value = max;
}

/* ============ Arranque ============ */
S.queue = lsGet(QUEUE_KEY, []); S.failed = lsGet(FAIL_KEY, []);
sb.auth.onAuthStateChange((_e, session) => {
  // Sin conexión no se puede renovar la sesión: si ya habías entrado, se sigue con los datos guardados
  if (!session && !navigator.onLine && lsGet(WAS_KEY, false) && lsGet(SNAP_KEY, null)) session = {offline:true};
  if (session && !session.offline) lsSet(WAS_KEY, true);
  const was = !!S.session; S.session = session;
  if (session && !was) setTimeout(() => loadAll(), 0); else render();
});
window.addEventListener('online', async () => {
  updateOffBar();
  if (S.session && S.session.offline){ const r = await sb.auth.getSession(); if (r.data && r.data.session) S.session = r.data.session; }
  await flushQueue(); await loadAll(false); if (S.tab !== 'scan') render();
});
window.addEventListener('offline', updateOffBar);
setInterval(() => { if (S.queue.length && navigator.onLine) flushQueue(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
