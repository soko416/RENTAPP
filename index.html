function updateOffBar(){
  const el = $('#offbar'); if (!el) return;
  const n = S.queue.length, off = !navigator.onLine, f = S.failed.length;
  if (!off && !n && !f){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = off ? `Sin conexión${n ? ` · ${n} pendiente${n===1?'':'s'} de enviar` : ''}` : n ? `Enviando ${n} pendiente${n===1?'':'s'}…` : `${f} escaneo${f===1?'':'s'} sin registrar`;
}
function localCond(uid, cond, note, clear){
  const u = unitById(uid); if (!u) return;
  if (cond === 'repair') u.status = 'repair';
  else if (cond === 'incomplete') u.missing_note = note || 'Incompleto';
  else if (clear) u.missing_note = null;
}
// Refleja la operación en los datos del móvil al instante
function applyLocal(op){
  if (op.t === 'out'){ const r = S.reservations.find(x => x.unit_id === op.unit_id && x.project_id === op.project_id && x.state !== 'returned'); if (r) r.state = 'out'; }
  else if (op.t === 'in'){ const r = S.reservations.find(x => x.unit_id === op.unit_id && x.state === 'out'); if (r) r.state = 'returned'; localCond(op.unit_id, op.cond, op.note, op.clear); }
  else if (op.t === 'kout'){
    S.reservations.filter(x => x.project_id === op.project_id && x.kit_id === op.kit_id && x.state === 'planned').forEach(x => x.state = 'out');
    S.bulkRes.filter(x => x.project_id === op.project_id && x.kit_id === op.kit_id && x.state === 'planned').forEach(x => x.state = 'out');
  } else if (op.t === 'bout'){
    const b = S.bulkRes.find(x => x.id === op.bulk_id);
    if (b && b.state === 'planned'){
      if (op.qty >= b.qty) b.state = 'out';
      else { b.qty -= op.qty; S.bulkRes.push({...b, id:'tmp-' + op.qid, qty:op.qty, state:'out'}); }
    }
  } else if (op.t === 'uundo'){
    const r = S.reservations.find(x => x.unit_id === op.unit_id && x.project_id === op.project_id && x.state === 'out'); if (r) r.state = 'planned';
  } else if (op.t === 'kundo'){
    S.reservations.filter(x => x.project_id === op.project_id && x.kit_id === op.kit_id && x.state === 'out').forEach(x => x.state = 'planned');
    S.bulkRes.filter(x => x.project_id === op.project_id && x.kit_id === op.kit_id && x.state === 'out').forEach(x => x.state = 'planned');
  } else if (op.t === 'bundo'){
    const b = S.bulkRes.find(x => x.id === op.bulk_id); if (b && b.state === 'out') b.state = 'planned';
  } else if (op.t === 'bin'){
    const b = S.bulkRes.find(x => x.id === op.bulk_id);
    if (b && b.state === 'out'){
      if (op.qty >= b.qty) b.state = 'returned';
      else { b.qty -= op.qty; S.bulkRes.push({...b, id:'tmp-' + op.qid, qty:op.qty, state:'returned'}); }
      if (op.cond === 'repair' && op.n > 0){ const m = modelById(b.model_id); if (m) m.bulk_repair = bulkRepair(m) + op.n; }
      if ((op.cond === 'lost' || (op.cond === 'incomplete' && op.baja)) && op.n > 0){      // dados de baja: se cierran y se restan del stock
        if (op.cond === 'incomplete') b.state = 'returned';
        const m = modelById(b.model_id); if (m) m.bulk_stock = Math.max(0, (m.bulk_stock || 0) - op.n);
      }
    }
  } else if (op.t === 'kin'){

// Peso, volumen y potencia de todo lo reservado en un show
function loadStats(p){
  const rs = S.reservations.filter(r => r.project_id === p.id), bs = S.bulkRes.filter(b => b.project_id === p.id);
  let kg = 0, m3 = 0, w = 0; const noW = new Set(), noP = new Set();
  const add = (m, qty) => {
    if (!m) return;
    if (m.weight_kg == null) noW.add(m.name); else kg += Number(m.weight_kg) * qty;
    m3 += vol(m) * qty;
    if (m.power_w == null) noP.add(m.name); else w += Number(m.power_w) * qty;
  };
  rs.forEach(r => { const u = unitById(r.unit_id); if (u) add(modelById(u.model_id), 1); });
  bs.forEach(b => add(modelById(b.model_id), b.qty));
  [...new Set([...rs, ...bs].map(x => x.kit_id).filter(Boolean))].forEach(kid => {
    const k = kitById(kid); if (!k) return;
    const kv = vol(k);
    if (kv > 0){   // si el case tiene medidas, ocupa su volumen en vez del suelto
      let cv = 0;
      rs.filter(r => r.kit_id === kid).forEach(r => { const u = unitById(r.unit_id); if (u) cv += vol(modelById(u.model_id)); });
      bs.filter(b => b.kit_id === kid).forEach(b => cv += vol(modelById(b.model_id)) * b.qty);
      m3 += kv - cv;
    }
    kg += Number(k.weight_kg) || 0;
  });
  return {kg, m3, w, noW:[...noW], noP:[...noP]};
}

    <div class="sub">Orientativo, a máxima potencia y sin simultaneidad.</div>

const isSchemaErr = e => !!e && (['PGRST205','PGRST204','PGRST202','42703','42P01','42883'].includes(e.code) || /schema cache|does not exist/i.test(e.message || ''));
// Qué scripts de Supabase faltan por ejecutar (se comprueba con consultas mínimas)
async function schemaMissing(){
  const probes = [
    ['esquema_supabase.sql', sb.from('categories').select('id').limit(1)],
    ['esquema_v2.sql', sb.from('kits').select('id').limit(1)],
    ['esquema_v3.sql', sb.from('settings').select('id').limit(1)],
    ['esquema_v4.sql', sb.from('equipment_models').select('color').limit(1)],
    ['esquema_v5.sql', sb.from('projects').select('payment_status').limit(1)],
    ['esquema_v6.sql', sb.from('clients').select('id').limit(1)],
    ['esquema_v7.sql', typeof sb.rpc === 'function' ? sb.rpc('merge_bulk_lines') : Promise.resolve({})],
    ['esquema_v8.sql', sb.from('bulk_logs').select('id').limit(1)],
    ['esquema_v8.sql', sb.from('equipment_models').select('bulk_repair').limit(1)],
    ['esquema_v9.sql', sb.from('categories').select('sort_order').limit(1)],
    ['esquema_v10.sql', sb.from('custom_labels').select('id').limit(1)],
    ['esquema_v10.sql', sb.from('settings').select('label_config').limit(1)],
    ['esquema_v11.sql', sb.from('units').select('label_printed_at').limit(1)],
    ['esquema_v11.sql', sb.from('maintenance_logs').select('photo_url').limit(1)],
    ['esquema_v12.sql', sb.from('trash').select('id').limit(1)],
    ['esquema_v12.sql', sb.from('audit_log').select('id').limit(1)],
    ['esquema_v12.sql', sb.from('settings').select('app_config').limit(1)]
  ];
  const rs = await Promise.all(probes.map(p => Promise.resolve(p[1]).then(r => r, e => ({error:e}))));
  return [...new Set(probes.filter((p, i) => rs[i].error && isSchemaErr(rs[i].error)).map(p => p[0]))];
}

  const made = fresh.length ? await db(sb.from('clients').insert(fresh.map(([k, g]) => ({name:g.name}))).select()) : [];

function clampQty(el){

async function returnSelected(){
  if (scanBusy) return;
  const sel = S.outSel; if (!sel.size) return toast('Marca primero lo que ha vuelto', true);
  scanBusy = true;
  try {

    const kitSel = [...sel].filter(k => k.startsWith('k:')).map(k => { const [, pid, kid] = k.split(':'); return {pid, kid}; });
    const kitRes = kitSel.map(k => ({...k, rs:S.reservations.filter(r => r.kit_id === k.kid && r.project_id === k.pid && r.state === 'out'), bs:S.bulkRes.filter(b => b.kit_id === k.kid && b.project_id === k.pid && b.state === 'out')}));
    const bulks = S.bulkRes.filter(b => sel.has('b:' + b.id) && b.state === 'out'), kitBulks = kitRes.flatMap(k => k.bs), allBulks = [...bulks, ...kitBulks];
    const bq = b => Math.min(b.qty, Math.max(1, parseInt(S.outQty[b.id] != null ? S.outQty[b.id] : b.qty) || b.qty));
    const qtyOf = b => b.kit_id ? b.qty : bq(b);            // las líneas de un kit vuelven enteras; las sueltas, lo que pone en «Vuelven»
    // estado de cada equipo y de cada línea de cables (Completo / Reparación / Incompleto), salvo en devolución rápida
    const units = [...looseR, ...kitRes.flatMap(k => k.rs)].map(r => unitById(r.unit_id)).filter(Boolean), conds = {}, sheet = (units.length || allBulks.length) && !quickReturn();
    let bconds = [];
    if (sheet){
      const r = await askConditionEx(units, allBulks.map(b => ({b, qty:qtyOf(b)})), 'Devolución desde la lista');
      if (!r) return;
      r.units.forEach(x => conds[x.unit_id] = x); bconds = r.bulks;
    }
    const cond = uid => conds[uid] || {cond:'ok', note:''};
    const ops = [];
    looseR.forEach(r => { const c = cond(r.unit_id), u = unitById(r.unit_id) || {}; ops.push({t:'in', unit_id:r.unit_id, cond:c.cond, note:(c.note || '').trim(), clear:c.cond === 'ok' && !!u.missing_note, photo:c.photo || null}); });
    kitRes.forEach(k => ops.push({t:'kin', kit_id:k.kid, skipBulk:sheet && k.bs.length > 0, items:k.rs.map(r => { const c = cond(r.unit_id), u = unitById(r.unit_id) || {}; return {unit_id:r.unit_id, cond:c.cond, note:(c.note || '').trim(), clear:c.cond === 'ok' && !!u.missing_note, photo:c.photo || null}; })}));
    const bops = bulkReturnOps(sheet ? allBulks : bulks, bconds, qtyOf);
    ops.push(...bops);
    bulks.forEach(b => { delete S.outQty[b.id]; });
    enqueueMany(ops);
    const pcs = bops.reduce((s, o) => s + o.qty, 0), bBad = bops.filter(o => o.cond !== 'ok').length;
    const nEq = units.length, bad = units.filter(u => cond(u.id).cond !== 'ok').length + bBad;
    sel.clear(); renderOutList(); updateProgress();
    scanMsg(`Devuelto desde la lista: ${nEq} equipo${nEq === 1 ? '' : 's'}${pcs ? ` y ${pcs} pieza${pcs === 1 ? '' : 's'} por cantidad` : ''}${bad ? ` · ${bad} con incidencia` : ''}${navigator.onLine ? '' : ' (pendiente de enviar)'}`, bad ? 'warn' : 'ok');
  } finally { scanBusy = false; }
}

function toggleLoad(kind, id, on){
  const pid = S.view && S.view.id; if (!projById(pid)) return;
  if (kind === 'u'){
    const r = S.reservations.find(x => x.id === id), u = r && unitById(r.unit_id); if (!r || !u) return;
    if (on){
      if (u.status !== 'ok'){ toast(`${unitLabel(u)} está ${UNIT_STATUS[u.status].toLowerCase()}. No se puede cargar.`, true); render(); return; }
      enqueue({t:'out', unit_id:u.id, project_id:pid});
    } else enqueue({t:'uundo', unit_id:u.id, project_id:pid});
  } else if (kind === 'k'){
    if (on){
      const bad = S.reservations.filter(r => r.project_id === pid && r.kit_id === id && r.state === 'planned').map(r => unitById(r.unit_id)).find(u => u && u.status !== 'ok');
      if (bad){ toast(`${unitLabel(bad)} está ${UNIT_STATUS[bad.status].toLowerCase()}. No se puede cargar el kit.`, true); render(); return; }
      enqueue({t:'kout', kit_id:id, project_id:pid});
    } else enqueue({t:'kundo', kit_id:id, project_id:pid});
  } else {
    const b = S.bulkRes.find(x => x.id === id); if (!b) return;
    if (on){ const q = Math.min(b.qty, Math.max(1, parseInt(S.loadQty[id] != null ? S.loadQty[id] : b.qty) || b.qty)); delete S.loadQty[id]; enqueue({t:'bout', bulk_id:id, qty:q, expect:b.qty}); }
    else enqueue({t:'bundo', bulk_id:id});
  }
  render();
}
function loadAllMark(pid, on){
  const L = loadModel(projById(pid)), ops = []; let skipped = 0;
  if (on){
    L.kits.forEach(e => { if (!e.rs.concat(e.bs).some(x => x.state === 'planned')) return;
      if (e.rs.some(r => r.state === 'planned' && (unitById(r.unit_id) || {}).status !== 'ok')){ skipped++; return; }
      ops.push({t:'kout', kit_id:e.kit.id, project_id:pid}); });
    L.units.forEach(({r, u}) => { if (r.state !== 'planned') return; if (u.status !== 'ok'){ skipped++; return; } ops.push({t:'out', unit_id:u.id, project_id:pid}); });
    L.bulks.forEach(({b}) => { if (b.state === 'planned') ops.push({t:'bout', bulk_id:b.id, qty:b.qty, expect:b.qty}); });
  } else {
    if (!confirm('¿Desmarcar todo lo cargado? El material volverá a estar pendiente de cargar. (Lo ya devuelto no cambia.)')) return;
    L.kits.forEach(e => { if (e.rs.concat(e.bs).some(x => x.state === 'out')) ops.push({t:'kundo', kit_id:e.kit.id, project_id:pid}); });
    L.units.forEach(({r, u}) => { if (r.state === 'out') ops.push({t:'uundo', unit_id:u.id, project_id:pid}); });
    L.bulks.forEach(({b}) => { if (b.state === 'out') ops.push({t:'bundo', bulk_id:b.id}); });
  }
  if (!ops.length) return toast(on ? 'No queda nada por cargar.' : 'No hay nada cargado que desmarcar.');
  enqueueMany(ops); render();
  if (skipped) toast(`${skipped} elemento${skipped === 1 ? '' : 's'} no se ha cargado porque no está operativo.`, true);
}

/* ============ BUSCAR UNA UNIDAD POR CÓDIGO O POR Nº DE SERIE ============ */
const compactStr = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
// Acepta el código interno (U-…) o el número de serie (LB001, lb-001…). Si el número de serie lo comparten
// varias unidades, se queda con la que tiene sentido en ese momento (reservada en el show elegido, o fuera del almacén).
function findUnitByInput(raw){
  const code = String(raw || '').trim().toUpperCase();
  const byCode = S.units.find(x => x.code === code); if (byCode) return {u:byCode};
  const k = compactStr(raw); if (!k) return {};
  let hits = S.units.filter(x => x.serial_number && compactStr(x.serial_number) === k);
  if (hits.length > 1){
    const mode = S.scan.mode;
    const pref = mode === 'out' ? hits.filter(x => S.reservations.some(r => r.unit_id === x.id && r.project_id === S.scan.project && r.state !== 'returned'))
      : mode === 'in' ? hits.filter(x => S.reservations.some(r => r.unit_id === x.id && r.state === 'out')) : [];
    if (pref.length) hits = pref;
  }
  if (hits.length === 1) return {u:hits[0]};
  return hits.length > 1 ? {many:hits} : {};
}

/* ============ UNIR LÍNEAS REPETIDAS DE MATERIAL POR CANTIDAD ============ */
// Mismo show + mismo material + mismo kit + mismo estado = una sola línea (p. ej. «Cable ×2» y «Cable ×18» fuera → «Cable ×20»)
function hasBulkDupes(){
  const seen = new Set();
  return S.bulkRes.some(b => {
    if (String(b.id).startsWith('tmp-')) return false;
    const k = [b.project_id, b.model_id, b.kit_id || '', b.state].join('|');
    if (seen.has(k)) return true; seen.add(k); return false;
  });
}
// La unión la hace la base de datos en una sola operación (esquema_v7.sql). Solo se pide cuando hay conexión y nada pendiente de enviar.
async function mergeBulk(){
  if (typeof sb.rpc !== 'function') return 0;
  const r = await sb.rpc('merge_bulk_lines');
  if (r.error){ if (isSchemaErr(r.error)) S.mergeOff = true; return 0; }
  return r.data || 0;
}
function autoMergeBulk(){
  if (S.merging || S.mergeOff || (S.mergeTries || 0) >= 5) return;
  if (!navigator.onLine || S.queue.length || !S.session || S.session.offline || !hasBulkDupes()) return;
  S.merging = true; S.mergeTries = (S.mergeTries || 0) + 1;
  mergeBulk().then(n => { S.merging = false; if (n > 0) loadAll(true); }).catch(() => { S.merging = false; });
}

/* ============ ORDEN DE LOS MODELOS: por nombre y por tamaño ============ */
// El tamaño en metros que aparece en el nombre (3M, 10 m, 0,5m…) y el nombre sin ese tamaño: «Cable DMX 5p 3M» → «Cable DMX 5p» y 3
function modelSize(name){
  const s = String(name || ''), re = /(\d+(?:[.,]\d+)?)\s*(?:m|mt|mts|metros?)\b/gi;
  let x, last = null; while ((x = re.exec(s))) last = x;
  if (!last) return {size:null, family:s.trim()};
  return {size:parseFloat(last[1].replace(',', '.')), family:(s.slice(0, last.index) + ' ' + s.slice(last.index + last[0].length)).replace(/\s+/g, ' ').trim()};
}
// Primero por nombre (todos los «Cable DMX 5p» juntos) y dentro de cada nombre, del más corto al más largo (1 m, 3 m, 5 m… 25 m)
function modelCmp(a, b){
  const x = modelSize(a.name), y = modelSize(b.name);
  return x.family.localeCompare(y.family, 'es', {numeric:true})
    || (x.size == null ? 1e9 : x.size) - (y.size == null ? 1e9 : y.size)
    || String(a.name || '').localeCompare(String(b.name || ''), 'es', {numeric:true});
}

/* ============ ORDEN DE LAS CATEGORÍAS ============ */
// Primero las que tienen orden (por su número) y, si no hay número, alfabéticamente

/* ============ GESTIONAR MARCAS ============ */
// Marcas agrupadas sin distinguir mayúsculas ni acentos: «Thomann» y «thomann» son la misma marca escrita de dos formas
function brandGroups(){
  const g = new Map();
  S.models.forEach(m => { const b = String(m.brand || '').trim(); if (!b) return; const k = norm(b); const e = g.get(k) || {key:k, variants:new Map(), ids:[]};
    e.variants.set(b, (e.variants.get(b) || 0) + 1); e.ids.push(m.id); g.set(k, e); });
  return [...g.values()].map(e => { const cap = v => /^[A-ZÁÉÍÓÚÑ]/.test(v) && v !== v.toUpperCase() ? 0 : 1;          // en un empate gana «Thomann» sobre «thomann» y «THOMANN»
    const vs = [...e.variants.entries()].sort((a, b) => b[1] - a[1] || cap(a[0]) - cap(b[0]) || a[0].localeCompare(b[0], 'es')); return {key:e.key, name:vs[0][0], variants:vs.map(v => v[0]), ids:e.ids}; })
    .sort((a, b) => a.name.localeCompare(b.name, 'es'));
}
function openBrands(){
  const g = brandGroups();
  openModal(`<h2>Marcas</h2><div class="sub">Renombra una marca o únela con otra: el cambio se aplica a todos los modelos que la usan. Si una marca está escrita de varias formas, puedes unificarla.</div>
    ${g.length ? `<div class="list" style="margin:10px 0">${g.map((x, i) => `<div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="sub">${x.ids.length} modelo${x.ids.length === 1 ? '' : 's'}</div>${x.variants.length > 1 ? `<div class="sub" style="color:var(--warn);font-weight:600">Escrita de ${x.variants.length} formas: ${esc(x.variants.join(', '))}</div>` : ''}</div>
      <div style="display:flex;flex-direction:column;gap:4px">${x.variants.length > 1 ? `<button class="btn small primary" onclick="unifyBrand(${i})">Unificar</button>` : ''}<button class="btn small" onclick="renameBrand(${i})">Renombrar</button></div></div>`).join('')}</div>`
      : `<div class="empty" style="margin:20px 0">Aún no hay marcas.</div>`}`);

async function unifyBrand(i){

async function renameBrand(i){

const LABEL_DEFAULT = Object.assign({}, LABEL_PRESETS[0], {brand:'RENTFORSHOW', showBrand:true, preset:'rentapp'});
function labelCfg(){
  const c = Object.assign({}, LABEL_DEFAULT, (S.settings && S.settings.label_config) || {});
  ['pw','ph','w','h','gx','gy','mt','ml'].forEach(k => { c[k] = Number(c[k]); if (!isFinite(c[k]) || c[k] < 0) c[k] = LABEL_DEFAULT[k]; });
  ['cols','rows'].forEach(k => { c[k] = Math.max(1, Math.round(Number(c[k]) || LABEL_DEFAULT[k])); });
  c.pw = Math.max(20, c.pw); c.ph = Math.max(20, c.ph); c.w = Math.max(8, c.w); c.h = Math.max(8, c.h);
  c.brand = String(c.brand == null ? LABEL_DEFAULT.brand : c.brand).trim(); c.showBrand = c.showBrand !== false; c.border = !!c.border;
  return c;
}
const labelPresetName = c => (LABEL_PRESETS.find(p => p.id === c.preset) || LABEL_PRESETS[LABEL_PRESETS.length - 1]).name;
// Pegatinas grandes: diseño completo. Pegatinas pequeñas: diseño compacto (QR + número).
const labelLayout = c => (c.w >= 55 && c.h >= 22) ? 'full' : 'compact';
const labelScale = c => { const b = LABEL_BASE[labelLayout(c)], bd = c.border ? 0.6 : 0; return Math.max(0.1, Math.min((c.w - bd) / b.w, (c.h - bd) / b.h)); };
const labelsPerSheet = c => c.cols * c.rows;

// Si el texto de la barra es largo, se reduce la letra para que quepa dentro de la barra negra
function brandFs(txt, lay){
  const base = lay === 'full' ? 9 : 5.5, avail = lay === 'full' ? 33 : 16, fs = Math.min(base, avail / (Math.max(1, String(txt).length) * 0.265));
  return fs < base ? ` style="font-size:${Math.max(3.5, fs).toFixed(1)}pt"` : '';
}
// Contenido de una pegatina. d = {kind:'unit', id} | {kind:'kit', id} | {kind:'custom', title, sub, line3, tile, qr, brand}
function labelBoxHtml(d, cfg){
  const lay = labelLayout(cfg), k = labelScale(cfg);
  const brand = cfg.showBrand && cfg.brand && d.brand !== false ? `<div class="brand"${brandFs(cfg.brand, lay)}>${esc(cfg.brand)}</div>` : '';
  const tileCls = s => String(s).length >= 4 ? 'd4' : String(s).length === 3 ? 'd3' : '';
  let qr = '', lt = '';
  if (d.kind === 'unit'){
    const u = unitById(d.id); if (!u) return '';
    const m = modelById(u.model_id) || {}, nn = nominalNumber(u), nm = m.name || '', sz = nm.length <= 10 ? '' : nm.length <= 14 ? 'm' : 's';
    qr = qrSvg(u.code);
    const head = nn == null ? `<span class="big ${unitName(u).length <= 13 ? '' : unitName(u).length <= 17 ? 'm' : 's'}">${esc(unitName(u))}</span>`
      : `<div class="lrow"><span class="ltile ${tileCls(nn)}">${nn}</span>${lay === 'full' ? `<span class="lname ${sz}">${esc(nm)}</span>` : ''}</div>`;
    lt = head + (u.serial_number ? `<span class="mini">${esc(u.serial_number)}</span>` : `<span class="code">${esc(u.code)}</span>`) + brand;
  } else if (d.kind === 'kit'){
    const kt = kitById(d.id); if (!kt) return '';
    qr = qrSvg(kt.code);
    lt = `<b>${esc(kt.name)}</b>${lay === 'full' ? '<span>KIT</span>' : ''}<span class="code">${esc(kt.code)}</span>` + brand;
  } else {
    qr = d.qr ? qrSvg(d.qr) : '';
    const tl = d.title || '', ts = tl.length <= (d.tile ? 9 : 14) ? '' : tl.length <= (d.tile ? 16 : 24) ? 'm' : 's';
    const row = (d.tile || tl) ? `<div class="lrow">${d.tile ? `<span class="ltile ${tileCls(d.tile)}">${esc(d.tile)}</span>` : ''}${tl ? `<span class="ctitle ${ts}">${esc(tl)}</span>` : ''}</div>` : '';
    lt = row + (d.sub ? `<span class="csub">${esc(d.sub)}</span>` : '') + (d.line3 ? `<span class="cline">${esc(d.line3)}</span>` : '') + brand;
  }
  return `<div class="lbox label ${lay}" style="--k:${k.toFixed(4)}">${qr ? `<div class="qr">${qr}</div>` : ''}<div class="lt">${lt}</div></div>`;
}
const labelPos = (cfg, col, row) => `left:${(cfg.ml + col * (cfg.w + cfg.gx)).toFixed(3)}mm;top:${(cfg.mt + row * (cfg.h + cfg.gy)).toFixed(3)}mm;width:${cfg.w}mm;height:${cfg.h}mm`;
const labelCellHtml = (d, cfg, col, row) => `<div class="lcell${cfg.border ? ' bd' : ''}" style="${labelPos(cfg, col, row)}">${labelBoxHtml(d, cfg)}</div>`;
// Hojas: cada pegatina va en su sitio exacto; «start» es la primera casilla libre de la primera hoja (para hojas ya empezadas)
function labelSheetsHtml(items, cfg, start){
  const per = labelsPerSheet(cfg), pages = [[]]; let slot = Math.max(1, Math.min(per, parseInt(start) || 1)) - 1;
  items.forEach(it => { if (slot >= per){ pages.push([]); slot = 0; } pages[pages.length - 1].push([slot, it]); slot++; });
  return pages.map(pg => `<div class="lsheet" style="width:${cfg.pw}mm;height:${(cfg.ph - 0.6).toFixed(2)}mm">${pg.map(([s, it]) => labelCellHtml(it, cfg, s % cfg.cols, Math.floor(s / cfg.cols))).join('')}</div>`).join('');
}
const labelPageCss = cfg => `@page{size:${cfg.pw}mm ${cfg.ph}mm;margin:0}`;
function printLabelItems(items, start){
  if (!items.length) return toast('No hay nada que imprimir', true);
  const cfg = labelCfg();
  S.markPending = {units:items.filter(i => i.kind === 'unit').map(i => i.id), kits:items.filter(i => i.kind === 'kit').map(i => i.id)};      // luego se pregunta si salieron bien
  printDoc('labels', labelSheetsHtml(items, cfg, start), labelPageCss(cfg));
}
function labelPagesCount(n, start, cfg){ const per = labelsPerSheet(cfg); return Math.max(1, Math.ceil(((Math.max(1, Math.min(per, start)) - 1) + n) / per)); }
// Dibujo de la hoja: oscuro = se imprime, gris = ya usada (se salta), vacío = libre
function sheetSvg(c, start, n){
  const per = labelsPerSheet(c), s0 = Math.max(0, Math.min(per - 1, (parseInt(start) || 1) - 1)), used = Math.min(per - s0, n), sc = 130 / c.pw;
  let cells = '';
  for (let i = 0; i < per; i++){
    const col = i % c.cols, row = Math.floor(i / c.cols), x = c.ml + col * (c.w + c.gx), y = c.mt + row * (c.h + c.gy), on = i >= s0 && i < s0 + used;
    cells += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${c.w}" height="${c.h}" rx="1.2" fill="${on ? '#1B1F27' : i < s0 ? '#C4CAD4' : 'none'}" stroke="#657084" stroke-width="0.4"/>`;
  }
  return `<svg viewBox="0 0 ${c.pw} ${c.ph}" width="${Math.round(c.pw * sc)}" height="${Math.round(c.ph * sc)}" role="img" aria-label="Vista previa de la hoja"><rect width="${c.pw}" height="${c.ph}" fill="#fff" stroke="#657084" stroke-width="0.6"/>${cells}</svg>`;
}
// Hoja de prueba: cada casilla con su número y sus diagonales, para comprobar la alineación sobre la hoja real
function printAlignment(c){
  c = c || labelCfg();
  const cells = Array.from({length:labelsPerSheet(c)}, (_, i) => `<div class="lcell bd atest" style="${labelPos(c, i % c.cols, Math.floor(i / c.cols))}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:100%"><path d="M0 0L100 100M100 0L0 100" stroke="#000" stroke-width="0.4" vector-effect="non-scaling-stroke" fill="none"/></svg><div class="an">${i + 1}</div><div class="as">${c.w}×${c.h} mm</div></div>`).join('');
  S.markPending = null;
  printDoc('labels', `<div class="lsheet" style="width:${c.pw}mm;height:${(c.ph - 0.6).toFixed(2)}mm">${cells}</div>`, labelPageCss(c));
}

function scPreset(id){

function scSet(k, v){

// ¿Caben las pegatinas en la página?
function scProblem(c){
  if (!(c.pw > 0 && c.ph > 0 && c.w > 0 && c.h > 0 && c.cols >= 1 && c.rows >= 1)) return 'Todas las medidas tienen que ser mayores que 0.';
  const needW = c.ml + c.cols * c.w + (c.cols - 1) * c.gx, needH = c.mt + c.rows * c.h + (c.rows - 1) * c.gy;

S.av = {from:'', to:'', only:false};
const availDay = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
// Rango consultado: del primer día a las 00:00 al último a las 23:59
function availRange(){
  const f = S.av.from || todayStr(), t = S.av.to || f; let a = new Date(f + 'T00:00:00'), b = new Date(t + 'T23:59:59');
  if (b < a){ a = new Date(t + 'T00:00:00'); b = new Date(f + 'T23:59:59'); }
  return {id:'__avail', starts_at:a.toISOString(), ends_at:b.toISOString(), a, b};
}
// Qué hay libre en ese rango: lo reservado en shows que se solapan, más lo que está físicamente fuera sin devolver, cuenta como ocupado
function availCompute(){
  const P = availRange(), busy = new Map();
  S.reservations.forEach(r => {
    if (r.state === 'returned') return; const q = projById(r.project_id); if (!q || q.status === 'cancelled') return;
    const ov = new Date(q.starts_at) < P.b && new Date(q.ends_at) > P.a;
    if (ov || r.state === 'out'){ if (!busy.has(r.unit_id)) busy.set(r.unit_id, []); busy.get(r.unit_id).push({p:q, out:r.state === 'out'}); }
  });
  const bulkBusy = {};
  S.bulkRes.forEach(b => {
    if (b.state === 'returned') return; const q = projById(b.project_id); if (!q || q.status === 'cancelled') return;
    const ov = new Date(q.starts_at) < P.b && new Date(q.ends_at) > P.a;
    if (ov || b.state === 'out') (bulkBusy[b.model_id] = bulkBusy[b.model_id] || []).push({p:q, qty:b.qty, out:b.state === 'out'});
  });
  return S.models.map(m => {
    if (m.is_bulk){
      const ls = bulkBusy[m.id] || [], used = ls.reduce((s, x) => s + x.qty, 0), rep = bulkRepair(m), total = m.bulk_stock || 0;
      return {m, total, free:Math.max(0, total - rep - used), busy:used, repair:rep, incomplete:0, shows:[...new Set(ls.map(x => x.p.name))], bulkLines:ls, units:[]};
    }
    const all = S.units.filter(u => u.model_id === m.id && u.status !== 'lost' && u.status !== 'retired');
    const free = all.filter(u => u.status === 'ok' && !busy.has(u.id)), busyU = all.filter(u => u.status === 'ok' && busy.has(u.id)), broken = all.filter(u => u.status === 'repair');
    return {m, total:all.length, free:free.length, busy:busyU.length, repair:broken.length, incomplete:free.filter(u => u.missing_note).length,
      shows:[...new Set(busyU.flatMap(u => busy.get(u.id).map(x => x.p.name)))], units:{free, busyU, broken, busy}, bulkLines:[]};
  }).filter(r => r.total > 0);
}

const TRASH_KIND = k => ({model:'Modelo', unit:'Unidad', kit:'Kit', project:W.S, client:'Cliente', technician:'Técnico', category:'Categoría', custom_label:'Pegatina'})[k] || k;
const trashTable = (t, n) => { const one = n === 1, o = {equipment_models:['modelo','modelos'], units:['unidad','unidades'], reservations:['reserva','reservas'], bulk_reservations:['línea de cables','líneas de cables'], kit_items:['pieza de kit','piezas de kit'], maintenance_logs:['registro de mantenimiento','registros de mantenimiento'], bulk_logs:['incidencia de cables','incidencias de cables'], scan_events:['movimiento','movimientos'], kits:['kit','kits'], projects:[W.s, W.p], clients:['cliente','clientes'], technicians:['técnico','técnicos'], categories:['categoría','categorías'], crew_assignments:['asignación','asignaciones'], custom_labels:['pegatina','pegatinas']}[t]; return o ? o[one ? 0 : 1] : t; };
// Foto de todo lo que se va a borrar (incluido lo que se borra en cascada), para poder restaurarlo
async function trashCollect(kind, id){
  const T = [], L = [], real = r => !String(r.id).startsWith('tmp-');
  const add = (t, rows) => { rows = rows.filter(real); if (rows.length) T.push({t, rows}); };
  const events = async ids => { if (!ids.length || !navigator.onLine) return []; try { const r = await sb.from('scan_events').select('*').in('unit_id', ids).limit(3000); return r.error ? [] : (r.data || []); } catch (e) { return []; } };
  if (kind === 'model'){
    const m = modelById(id), us = S.units.filter(u => u.model_id === id), ids = new Set(us.map(u => u.id));
    add('equipment_models', [m]); add('units', us); add('reservations', S.reservations.filter(r => ids.has(r.unit_id)));
    add('bulk_reservations', S.bulkRes.filter(b => b.model_id === id)); add('kit_items', S.kitItems.filter(k => ids.has(k.unit_id) || k.model_id === id));
    add('maintenance_logs', S.maint.filter(l => ids.has(l.unit_id))); add('bulk_logs', S.bulkLogs.filter(l => l.model_id === id)); add('scan_events', await events([...ids]));
  } else if (kind === 'unit'){
    add('units', [unitById(id)]); add('reservations', S.reservations.filter(r => r.unit_id === id)); add('kit_items', S.kitItems.filter(k => k.unit_id === id));
    add('maintenance_logs', S.maint.filter(l => l.unit_id === id)); add('scan_events', await events([id]));
  } else if (kind === 'kit'){
    add('kits', [kitById(id)]); add('kit_items', S.kitItems.filter(k => k.kit_id === id));
    L.push({t:'reservations', col:'kit_id', ids:S.reservations.filter(r => r.kit_id === id).map(r => r.id), val:id}, {t:'bulk_reservations', col:'kit_id', ids:S.bulkRes.filter(b => b.kit_id === id).map(b => b.id), val:id});
  } else if (kind === 'project'){
    add('projects', [projById(id)]); add('reservations', S.reservations.filter(r => r.project_id === id)); add('bulk_reservations', S.bulkRes.filter(b => b.project_id === id)); add('crew_assignments', S.assigns.filter(a => a.project_id === id));
  } else if (kind === 'client'){
    add('clients', [clientById(id)]); L.push({t:'projects', col:'client_id', ids:S.projects.filter(p => p.client_id === id).map(p => p.id), val:id});
  } else if (kind === 'technician'){
    add('technicians', [S.techs.find(t => t.id === id)]); add('crew_assignments', S.assigns.filter(a => a.technician_id === id));
  } else if (kind === 'category'){
    add('categories', [S.categories.find(c => c.id === id)]); L.push({t:'equipment_models', col:'category_id', ids:S.models.filter(m => m.category_id === id).map(m => m.id), val:id});
  } else if (kind === 'custom_label'){
    add('custom_labels', [S.customLabels.find(c => c.id === id)]);
  }
  return {tables:T, links:L.filter(l => l.ids.length)};
}
// Guarda la foto en la papelera y luego borra. Si todavía no existe la papelera (falta esquema_v12.sql), borra igual y lo dice.
async function trashRun(kind, id, label, del){
  let tid = null;
  try {

let undoTimer;
function undoBar(msg, tid){

async function restoreTrash(tid){
  const r = await sb.from('trash').select('*').eq('id', tid).limit(1);
  if (r.error || !(r.data || []).length) return toast(r.error ? errMsg(r.error) : 'Ya no está en la papelera', true, true);
  const row = r.data[0], d = row.data || {}; let problems = 0, lastErr = null;
  for (const {t, rows} of (d.tables || [])) for (let i = 0; i < rows.length; i += 400){
    const res = await sb.from(t).upsert(rows.slice(i, i + 400)); if (res.error){ problems++; lastErr = res.error; }
  }
  for (const l of (d.links || [])){ const res = await sb.from(l.t).update({[l.col]:l.val}).in('id', l.ids); if (res.error){ problems++; lastErr = res.error; } }
  if (problems){ await loadAll(); return toast(`Se restauró solo una parte: ${errMsg(lastErr)} Sigue en la papelera por si quieres volver a intentarlo.`, true, true); }
  await sb.from('trash').delete().eq('id', tid);

  toast(`«${row.label}» restaurado`);
}

const AUD_FIELD = {name:'nombre', brand:'marca', category_id:'categoría', day_rate:'tarifa', weight_kg:'peso', power_w:'potencia', width_cm:'ancho', height_cm:'alto', depth_cm:'fondo', notes:'notas', serial_number:'nº de serie', status:'estado', missing_note:'qué falta', purchase_date:'fecha de compra', next_service:'próxima revisión', lamp_hours:'horas de lámpara', lamp_life_hours:'vida de la lámpara', is_bulk:'por cantidad', bulk_stock:'stock', bulk_repair:'en reparación', color:'color', photo_url:'foto', starts_at:'inicio', ends_at:'fin', client:'cliente', client_id:'cliente', phone:'teléfono', email:'email', label_printed_at:'etiqueta impresa', sort_order:'orden', rider_notes:'notas del rider', payment_status:'cobro', invoice_no:'nº de factura', due_date:'vencimiento'};
const AUD_HIDE = new Set(['id', 'created_at', 'updated_at', 'calendar_token']);
function audValue(k, v){
  if (v == null || v === '') return '(vacío)';

  if (k === 'category_id') return (S.categories.find(c => c.id === v) || {}).name || '(otra)';
  if (k === 'client_id') return (clientById(v) || {}).name || '(otro)';
  let t = typeof v === 'object' ? JSON.stringify(v) : String(v);
  if (/(_at|date|service)$/.test(k) && /^\d{4}-\d\d-\d\d/.test(t)) t = t.slice(0, 10);
  return t.length > 40 ? t.slice(0, 40) + '…' : t;
}
function audText(r){

}

/* ============ Arranque ============ */
S.queue = lsGet(QUEUE_KEY, []); S.failed = lsGet(FAIL_KEY, []);
sb.auth.onAuthStateChange((_e, session) => {
  // Sin conexión no se puede renovar la sesión: si ya habías entrado, se sigue con los datos guardados
  if (!session && !navigator.onLine && lsGet(WAS_KEY, false) && lsGet(SNAP_KEY, null)) session = {offline:true};
  if (session && !session.offline) lsSet(WAS_KEY, true);
  const was = !!S.session; S.session = session;
  if (session && !was) setTimeout(() => loadAll(), 0); else render();
});
window.addEventListener('online', async () => {
  updateOffBar();
  if (S.session && S.session.offline){ const r = await sb.auth.getSession(); if (r.data && r.data.session) S.session = r.data.session; }
  await flushQueue(); await loadAll(false); if (S.tab !== 'scan') render();
});
window.addEventListener('offline', updateOffBar);
setInterval(() => { if (S.queue.length && navigator.onLine) flushQueue(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
